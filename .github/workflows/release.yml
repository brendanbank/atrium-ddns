# Publish a multi-architecture image for a tagged release.
#
# Triggered by a `v*` tag. The tag is the decision; everything here is
# mechanical.
#
# ## Two things this gets right that a default `docker build` does not
#
# **`target: runtime`, not the default.** `dev` is the LAST stage in the
# Dockerfile, so a plain build produces it — and `dev` carries pytest,
# pytest-xdist, httpx and the whole `tests/` compat tree. Publishing the
# default would ship the test harness to production, and it would look
# identical from the outside.
#
# **The version is checked against the source, not trusted from the tag.**
# A tag is a string somebody typed. `backend/pyproject.toml` is what the
# package actually reports. When they disagree the image would claim a
# version the code does not, so this refuses instead.
name: Release

on:
  push:
    # An allowlist, not `v*`. `scripts/dev-release.sh` cuts staging tags like
    # `v0.1.0-dev.zone-modal.1` whose entire purpose is to ship to a staging
    # host *without CI running* — and `v*` matched every one of them. Anchored
    # patterns match the whole ref, so a trailing `-dev...` no longer qualifies.
    # A prerelease series (`-rc.1`) would need its own line, deliberately.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.2.0. Must already exist.'
        required: true

permissions:
  contents: write     # create the GitHub Release
  packages: write     # push to ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Multi-arch image + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: The tag and the package must agree
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          tag_version="${tag#v}"
          pkg_version="$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml | head -n1)"
          echo "tag        $tag_version"
          echo "pyproject  $pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo
            echo "The tag says $tag_version and backend/pyproject.toml says $pkg_version."
            echo "The image would report a version the code does not. Bump the"
            echo "version in pyproject.toml and re-tag, or tag the right commit."
            exit 1
          fi

      # Read the sha off the checkout, not `github.sha`. On a tag push the
      # two agree; on `workflow_dispatch` they do not — `github.sha` is then
      # the head of the branch the workflow file was dispatched from
      # (master), while the checkout above is at the tag being built. A
      # re-publish of an older tag would otherwise stamp and label the image
      # with a commit it was not built from, which is precisely the question
      # the stamp exists to answer.
      - name: Resolve build commit
        run: echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The base image is multi-arch (linux/amd64 + linux/arm64, verified
      # 2026-09-02), so arm64 is a real build rather than emulated-and-hoped.
      # QEMU is still needed for the frontend-builder stage's npm work.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # org.opencontainers.image.created must be the moment of the build.
      # There is no context value for it — github.event.repository.updated_at
      # is when the repo record last changed, which is not the same thing and
      # is wrong in a way nobody would notice.
      - name: Build timestamp
        id: stamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime          # NOT the default; see the header
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          # The build stamp `GET /api/version` reports and the user menu
          # renders — the tag verbatim, plus the sha of the checkout this
          # was built from. Without these the published image reports no
          # app version at all and the menu shows the atrium line only.
          # The atrium half of that answer needs nothing here: atrium's own
          # image sets ATRIUM_VERSION / ATRIUM_COMMIT as ENV, and Docker
          # inherits ENV across `FROM`.
          build-args: |
            ATRIUM_APP_VERSION=${{ github.event.inputs.tag || github.ref_name }}
            ATRIUM_APP_COMMIT=${{ env.BUILD_COMMIT }}
          tags: |
            ${{ env.IMAGE }}:${{ (github.event.inputs.tag || github.ref_name) }}
            ${{ env.IMAGE }}:latest
          # Conventional OCI keys, so an image can be asked what it is rather
          # than inferred from the tag it happens to be pulled by. `.revision`
          # is the one that matters: a tag can be moved, a commit sha cannot.
          labels: |
            org.opencontainers.image.title=atrium-ddns
            org.opencontainers.image.description=DynDNS host extension for atrium
            org.opencontainers.image.version=${{ (github.event.inputs.tag || github.ref_name) }}
            org.opencontainers.image.revision=${{ env.BUILD_COMMIT }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.stamp.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Assert on the manifest, not on the push exiting 0. A single-arch
      # image pushes just as successfully as a two-arch one.
      - name: Both architectures are actually in the manifest
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          got="$(docker buildx imagetools inspect "$IMAGE:$tag" \
                 | grep -oE 'linux/(amd64|arm64)' | sort -u | tr '\n' ' ')"
          echo "platforms in the manifest: $got"
          case "$got" in
            *linux/amd64*) ;; *) echo "amd64 missing"; exit 1 ;;
          esac
          case "$got" in
            *linux/arm64*) ;; *) echo "arm64 missing"; exit 1 ;;
          esac

      # Same reasoning as the arch check above: a label that failed to apply
      # pushes just as successfully as one that did, and the whole point of
      # these is to be trusted later by someone holding only the image.
      # Checked on every platform in the manifest, because labels are per
      # image config and a two-arch build writes two of them.
      #
      # The build stamp (ENV, not labels) is checked here for the same
      # reason and one more: a build arg the Dockerfile does not declare is
      # silently ignored by buildx — no warning that fails a build — and the
      # only visible symptom is a user menu that quietly stops naming the
      # app version months later.
      - name: The labels and the build stamp are actually on the image
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Image}}' \
            > /tmp/img.json
          python3 - "$tag" "${{ env.BUILD_COMMIT }}" <<'EOF'
          import json, sys

          want_version, want_revision = sys.argv[1], sys.argv[2]
          images = json.load(open("/tmp/img.json"))
          # Single-platform builds return one config, not a map keyed by
          # platform. Normalise so this cannot pass by iterating nothing.
          if "config" in images:
              images = {"(single)": images}
          if not images:
              sys.exit("no image configs in the manifest")

          failed = False
          for platform, image in images.items():
              config = image.get("config") or {}
              labels = config.get("Labels") or {}
              version = labels.get("org.opencontainers.image.version")
              revision = labels.get("org.opencontainers.image.revision")
              print(f"{platform}: version={version} revision={revision}")
              if version != want_version:
                  print(f"  ERROR: version is {version!r}, tag is {want_version!r}")
                  failed = True
              if revision != want_revision:
                  print(f"  ERROR: revision is {revision!r}, sha is {want_revision!r}")
                  failed = True

              # What `GET /api/version` will actually read at runtime.
              env = dict(
                  entry.split("=", 1)
                  for entry in (config.get("Env") or [])
                  if "=" in entry
              )
              stamp = {
                  "ATRIUM_APP_VERSION": want_version,
                  "ATRIUM_APP_COMMIT": want_revision,
              }
              for key, want in stamp.items():
                  got = env.get(key)
                  print(f"{platform}: {key}={got}")
                  if got != want:
                      print(f"  ERROR: {key} is {got!r}, expected {want!r}")
                      failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          {
            echo "**Image**"
            echo
            echo '```'
            echo "docker pull $IMAGE:$tag"
            echo '```'
            echo
            echo "\`linux/amd64\` and \`linux/arm64\`. Built from the \`runtime\`"
            echo "stage — the \`dev\` stage, which carries pytest and the compat"
            echo "suite, is deliberately not published."
          } > /tmp/notes.md
          gh release create "$tag" --title "$tag" --generate-notes \
            --notes-file /tmp/notes.md
