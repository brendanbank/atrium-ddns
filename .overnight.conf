# Overnight-run configuration for atrium-ddns.
# Shell-sourceable KEY=value; read by every script in the overnight-run skill
# and by find_ready.py. Environment variables of the same name win.
#
# Keep comments on their own lines, above the key they describe. This file is
# read twice — the shell scripts source it, find_ready.py parses it — and a
# trailing `# comment` on a value line once meant those two readings disagreed.
# Values are literal: `$VAR` is not expanded.
#
# Nothing here is a secret, and nothing here names a host. OVERNIGHT_DEPLOY_HOST
# is an ssh *alias* resolved by ~/.ssh/config, so the production hostname never
# lands in git even though the value is committed.

# --- identity -------------------------------------------------------------
OVERNIGHT_REPO=brendanbank/atrium-ddns
# project/board owner login; defaults to the repo owner
OVERNIGHT_OWNER=brendanbank
# project (board) number — https://github.com/users/brendanbank/projects/2
OVERNIGHT_PROJECT=2
# branch releases merge into
OVERNIGHT_TRUNK=master
# the branch this run merges into; set at the start of a run so the heartbeat
# compares against it rather than trunk
OVERNIGHT_MILESTONE_BRANCH=v1m2-host-backend-tenancy
# claim branches are <issue>_<slug>
OVERNIGHT_SLUG=overnight

# --- board vocabulary -----------------------------------------------------
# issues with this label are not work
OVERNIGHT_EPIC_LABEL=epic
OVERNIGHT_BLOCKED_LABEL=blocked
OVERNIGHT_TODO_COLUMN=Todo
OVERNIGHT_ACTIVE_COLUMN='In Progress'
OVERNIGHT_DONE_COLUMN=Done

# --- pre-flight -----------------------------------------------------------
# importable package name, to prove the venv resolves inside THIS worktree
OVERNIGHT_PACKAGE=atrium_ddns
# the gate stands the compose stack up; docker is a stop condition
OVERNIGHT_NEED_DOCKER=1
# 1 = a locked signing token halts the run. Set to 0 by the operator for the
# development phase: commits are still GPG-signed from the hardware token
# whenever it is unlocked, but a locked token no longer stops an unattended
# run. Revisit before anything is released from an unattended batch — the
# resulting history is unverifiable on GitHub.
OVERNIGHT_GPG_BLOCKING=0

# --- deploy ---------------------------------------------------------------
# An ssh *alias*, never a hostname. The real target lives only in
# ~/.ssh/config under this alias, so nothing in the checkout names the estate.
# The alias sets HostName, User, IdentityFile and IdentitiesOnly.
OVERNIGHT_DEPLOY_HOST=atrium-ddns-deploy
OVERNIGHT_DEPLOY_PATH=/usr/local/atrium-ddns
# Left EMPTY on purpose. The ssh alias above already carries
# `IdentityFile ~/.ssh/atrium-ddns-deploy` and `IdentitiesOnly yes`, which is
# what makes the run agent-independent: macOS points SSH_AUTH_SOCK at the
# launchd agent (no identities) and 1Password's agent is elsewhere and may be
# locked. Verified reaching the host with SSH_AUTH_SOCK unset.
#
# Naming the key here as well caused a real divergence: bash expands `~` when
# sourcing this file, Python reads it literally, so the two readings of the
# same key disagreed and `bootstrap-github.sh --check` failed. An absolute
# path would fix that but hardcodes one machine's home directory. The ssh
# config is the right home for it — one place, machine-local, already correct.
OVERNIGHT_DEPLOY_KEY=
OVERNIGHT_DEPLOY_BRANCH=testdrive
# service to exec into for the identity check
OVERNIGHT_COMPOSE_SERVICE=api
# 'container/path:repo/path', or one path if equal
OVERNIGHT_IDENTITY_FILE=/opt/host_app/src/atrium_ddns/router.py:backend/src/atrium_ddns/router.py
# host alembic chain (alembic_version_app), not atrium's
OVERNIGHT_MIGRATION_CMD='docker compose exec -T api alembic -c /opt/host_app/alembic.ini current'
