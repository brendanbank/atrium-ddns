# The ACME hand-over overlay — the cutover configuration for the TLS
# terminator, and nothing else.
#
#   docker compose -f compose.yaml -f compose.acme.yaml --profile tls up -d proxy
#
# (`make acme-up`, which is the same command with the file list already right.)
#
# ---------------------------------------------------------------------------
# Why this is an overlay and not an edit to `compose.yaml`
# ---------------------------------------------------------------------------
#
# `compose.yaml`'s `proxy` is what the deploy host runs **today**: port 8443, a
# certificate extracted read-only from the incumbent's ACME store, no ACME of
# its own. Editing that service in place would mean the next routine
# `docker compose up -d` on the deploy host tries to bind 80 and 443 — which
# the incumbent's Traefik is holding — and the hand-over would happen by
# accident, at whatever moment somebody deployed, rather than at step 5.4 of
# the runbook.
#
# So the hand-over is a **second file the operator names on purpose**. The
# diff between "today" and "after the hand-over" is this file, and it is
# reviewable as one thing.
#
# It overrides `command`, `ports` and `volumes` with `!override` rather than
# letting Compose merge them. Merging is wrong for all three:
#
#   * `command` merged would leave the 8443 entrypoint beside the new ones;
#   * `ports` merged would keep publishing 8443 as well as 80/443;
#   * `volumes` merged would mount **both** dynamic files, and both declare a
#     router called `host-api` — one with `PathPrefix(/)` and no resolver, one
#     with `Host(...)` and `certResolver: letsencrypt`. Traefik would take one
#     of them and the choice is not yours.
#
# ---------------------------------------------------------------------------
# Why the three variables have no defaults
# ---------------------------------------------------------------------------
#
# `${VAR:?...}` makes Compose refuse to load the file at all when the variable
# is missing or empty. That is deliberate for `LETSENCRYPT_CASERVER` in
# particular: the incumbent's compose defaults it to the **staging** directory
# when unset, so a stack that inherits a default gets certificates no browser
# trusts — and, because the extracted copy is still terminating TLS as the
# fallback, the symptom does not appear until the fallback is gone. A refusal
# at `compose config` time is the loudest this can be made, and it is loud
# weeks before it would otherwise be quiet.
#
# The guard cannot live in `compose.yaml`: Compose interpolates the whole
# document at load time, **including services whose profile is not active**
# (measured — `docker compose config` on a file with an inactive-profile
# `${X:?}` fails). A `:?` there would break `make up` for every developer.

services:
  proxy:
    environment:
      # Reaches the router rule through Traefik's own file-provider
      # templating — see infra/traefik/dynamic-acme.yml. Passing it as an
      # environment variable is what keeps the real hostname out of every
      # tracked file in this repository.
      TRAEFIK_HOSTNAME: ${TRAEFIK_HOSTNAME:?the public hostname the certificate is for — see .env.example}

    command: !override
      - --entrypoints.web.address=:80
      # 80 exists for the HTTP-01 challenge and for redirecting humans. It
      # carries no application traffic: DynDNS clients authenticate with HTTP
      # Basic, and a plaintext /nic/update is every device secret on the wire.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?the ACME account contact address — copy the incumbent's}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # Traefik's own default here is the PRODUCTION directory; the incumbent's
      # compose defaults it to staging. Two different silent answers to the
      # same missing variable is the whole reason this one is mandatory.
      - --certificatesresolvers.letsencrypt.acme.caserver=${LETSENCRYPT_CASERVER:?set the ACME directory explicitly — staging and production are one character apart in effect and weeks apart in symptom}
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
      # Repeated from compose.yaml because `command:` is `!override` here, not
      # merged — every flag the hand-over configuration needs has to be in this
      # list. Dropping this one would leave the post-cutover proxy emitting CLF
      # while compose.loki.yaml still parses it as JSON, i.e. the labels would
      # go missing at exactly the moment the service starts carrying real
      # traffic. See the longer note on the same flag in compose.yaml.
      - --accesslog.format=json
      # Query strings are dropped at the producer. `redact` is NOT a real
      # mode — it parses, starts cleanly, and behaves as `keep`.
      - --accesslog.fields.queryparameters.defaultmode=drop

    ports: !override
      # Deliberately unprefixed, like the mapping it replaces: Docker binds
      # both address families only when no host address is given, and about
      # two thirds of this service's real traffic is IPv6 (cutover runbook
      # § 1.3). A `0.0.0.0:` prefix here refuses that two thirds outright.
      #
      # The variables exist so the gate test can stand the *shipped* service
      # up on a throwaway port pair instead of testing a copy of it. Their
      # defaults are the production values.
      - "${ACME_HTTP_PUBLISH:-80}:80"
      - "${ACME_HTTPS_PUBLISH:-443}:443"

    volumes: !override
      - ./infra/traefik/dynamic-acme.yml:/etc/traefik/dynamic/dynamic-acme.yml:ro
      # The extracted copy of the incumbent's certificate, demoted from
      # primary to fallback. Still read-only, still a copy, still produced by
      # `make tls-extract`.
      - ${TLS_CERT_DIR:-./certs}:/certs:ro
      # This stack's OWN ACME store — read-write, and the one thing in this
      # file that must never point at the incumbent's directory. Runbook step
      # 5.4(b) copies the incumbent's `acme.json` in here *after* the
      # incumbent's Traefik has been stopped, so the store never has two
      # writers.
      - ${ACME_STORE_DIR:-./letsencrypt}:/letsencrypt
