[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atrium-ddns-host"
version = "0.1.7"
description = "Atrium Ddns host extension for Atrium"
requires-python = ">=3.12"

# Almost all runtime deps come from the atrium image (FastAPI,
# SQLAlchemy, Alembic, structlog, httpx, dnspython). Listing those here
# would just shadow atrium's pinned versions. The package is installed
# via `pip install ./backend` inside the image so `atrium_ddns` is
# importable on PYTHONPATH.
#
# The exception is below, and it is the only one. Measured against
# `ghcr.io/brendanbank/atrium:0.28` rather than assumed:
#
#   httpx      0.28.1   present   -> the Hetzner adapter uses it
#   dnspython  2.8.0    present   -> nsupdate, and every `nochg` check
#   requests   —        ABSENT    -> so the legacy Hetzner adapter's
#                                    import was ported to httpx rather
#                                    than adding a second HTTP client
#   boto3      —        ABSENT    -> declared here
#
# Route 53's API is SigV4-signed XML; there is no honest way to speak it
# without botocore, so #15 declares boto3 rather than shipping a
# `route53` backend type that raises on first use. Resolved clean into
# atrium's venv (botocore, jmespath, s3transfer, python-dateutil, six,
# urllib3 — none of which atrium already pins, so nothing is upgraded
# underneath it).
dependencies = [
    # Floor is the version this was resolved and tested against; the
    # ceiling is boto3's own major, which it has never bumped.
    "boto3>=1.43,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atrium_ddns"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# The one name the harness-guard population is derived from — #108.
#
# Clause 3 of V1M7 is about "every guard this suite relies on", and a guard
# is not the same thing as a test: it is a check whose subject is the
# suite's own instruments rather than the product's behaviour. Nothing in
# the collected set distinguishes the two, so the distinction is declared,
# once, here — and read back off pytest's own collection by
# `test_harness_guards.harness_guards()`. A list of guard names typed into
# a module would be the identical defect one release later, which is what
# #78 corrected `EXPECTED_PARTICIPANTS` for.
#
# Registering it is not optional decoration. `--strict-markers` is in the
# addopts below, so an unregistered `@pytest.mark.harness_guard` is a
# collection error rather than a silent no-op — which is exactly why #85
# left the marker to #108: adding one means editing this file.
#
# pytest refuses to attach a mark to a *fixture*, and one guard in this
# suite is a fixture (`conftest._sweep_unattributed_events`). That half of
# the population carries `conftest.harness_guard` as a plain attribute
# instead. Same registry, same name, two carriers, because pytest forbids
# the first one on fixtures — see `conftest.harness_guard`.
markers = [
    "functional: needs real infrastructure — a migrated MySQL schema (its FKs, ON UPDATE clauses and seeded rows exist only in the alembic chain), a bindable privileged port, or dialect-specific SQL such as EXPLAIN. Deselected by the unit lane, which runs on in-memory SQLite with no container; run by the container lane.",
    "harness_guard: a check whose subject is the test harness itself — it fails when the suite's own instruments have stopped being trustworthy, not when the product is wrong. The population clause 3 of V1M7 is swept over; see backend/tests/test_harness_guards.py.",
]

# Parallel by default, matching the recipe that gets atrium-pa to ~72
# tests/sec (6197 tests in 86s). `-n auto` is one worker per CPU;
# `--dist=loadfile` keeps every test in a file on the same worker, which is
# what makes module- and session-scoped fixtures behave — with the default
# `--dist=load` a session fixture is built once per worker and tests that
# share state through one get scheduled apart from it.
#
# To bisect a failure serially: `-n 0` (NOT `-p no:xdist` — that unloads the
# plugin while these addopts still pass `-n`, and pytest dies with
# "unrecognized arguments: -n"; `-o addopts=""` also works).
#
# Do NOT reach for serial mode to diagnose an apparent *hang*. xdist absorbs
# per-test output, so a hung run looks identical to a slow one — run
# `pytest <path> -v` from a terminal and let the test names print instead
# (`make test-backend-file FILE=...`). Forcing a serial run to investigate a
# hang has its own pathology and burns more time than it saves.
addopts = "-n auto --dist=loadfile -ra --strict-markers"
# One event loop for the whole session, not one per test.
#
# `app.db.get_session_factory()` caches a process-global engine, and its
# connection pool holds sockets bound to whichever loop first opened them.
# Under pytest-asyncio's default function-scoped loop, test 2 gets a fresh
# loop, pulls a pooled connection created on test 1's dead loop, and fails
# with "got Future attached to a different loop" — from the *fixture*, so it
# reports as an ERROR rather than a failure and looks like a fixture bug.
# Session scope matches how the app actually runs: one loop, one pool.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
