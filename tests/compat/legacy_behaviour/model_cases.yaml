# Legacy MODEL behaviour that survives the rewrite.
#
# Data only. No Python, no expressions, no imports.
#
# `../protocol_cases.yaml` owns the WIRE: status strings, response bodies,
# aggregation, byte-exact comparisons against a base URL. This file owns
# everything the wire cannot see -- what is in the row after the request, how
# many rows there are, which branch of a resolver ran, and what a limit
# arithmetically means. The two files never assert the same thing; see
# `../README.md` section "Model behaviour vs the wire table".
#
# Source of truth is the *behaviour* of `brendanbank/dyndns-route53` at `main`
# (commit 5d1c941), read directly from `models.py`, `dyndns.py`,
# `rate_limiter.py`, `health_checker.py`, `forms.py` and
# `lib/account/hetzner.py` -- not from the old test suite's assertions, which
# are a second source and frequently narrower than the code.
#
# 71 of the cases below were replayed against that implementation by
# `calibrate_against_legacy.py`. The `calibrated` field records the result.

version: 1

# ---------------------------------------------------------------------------
# What a disposition means. Every case has one, and `preserve` is not the
# default -- three of these rules are defects and one is a planned change, and
# recording them as such is the point of freezing them at all.
# ---------------------------------------------------------------------------
dispositions:
  preserve: >-
    the host must behave the same way. A change here is a compatibility
    regression.
  fix: >-
    the legacy behaviour is a defect. `legacy` records what it does today and
    `host` records what the rewrite must do instead. Nothing on the wire
    depends on it, which is why it is safe to fix.
  change: >-
    a deliberate design change carried by `docs/ops/refactor-plan.md`. `legacy`
    records what it does today so the change stays a decision rather than
    becoming a drift.

# ---------------------------------------------------------------------------
# Subjects. A case belongs to exactly one.
# ---------------------------------------------------------------------------
subjects:
  hostname: "the Hostname row: naming, uniqueness, ownership"
  ttl: "where the TTL comes from, what validates it, where it goes"
  backends: "Hostname.get_backends() -- which backends a request actually reaches"
  rate_limit: "the arithmetic of the limiter and where its numbers come from"
  event_log: "the shape of the rows the DDNS path writes to `events`"
  ip_tracking: "last_ip_v4 / last_ip_v6 / last_updated_at as a data source"
  provider: "the contract every DNS backend adapter must satisfy"
  health_check: "how a resolver answer becomes a HealthCheck status"
  storage: "domains, backends and their credentials at rest"
  auth: "what the DDNS credential is, and what it is not"

# ---------------------------------------------------------------------------
# Case fields
#
#   id           unique, stable, referenced from legacy_inventory.yaml
#   subject      one of `subjects`
#   disposition  one of `dispositions`
#   given        the situation
#   then         what must be true. Never an HTTP status string or a response
#                body -- those belong to protocol_cases.yaml
#   evidence     where the rule was read from
#   source       legacy test ids this rule was found in. `[]` means the rule
#                was found by reading the code and no legacy test covers it
#   calibrated   agree           replayed by calibrate_against_legacy.py, and
#                                 the legacy implementation behaves as this
#                                 case describes it. For a `preserve` case that
#                                 is also the host requirement; for a `fix` or
#                                 `change` case it confirms the `legacy` field
#                derived         not replayed -- read off the schema, the form
#                                 validator or the call site
#                not-replayable  cannot be replayed at all, and why is in the note
#   legacy/host  only on `fix` and `change` cases
#   note         optional
# ---------------------------------------------------------------------------
cases:

  # -------------------------------------------------------------------------
  # hostname
  # -------------------------------------------------------------------------
  - id: hostname-fqdn-is-the-prefix-joined-to-the-domain
    subject: hostname
    disposition: preserve
    given: "a hostname is registered as a prefix under a domain the user may use"
    then: "the stored name is `{prefix}.{domain.name}` and the domain is not repeated in it"
    evidence: "web_routes.py:492 / :572 build `fqdn` before constructing Hostname"
    source:
      - tests/test_app.py::TestHostnameManagement::test_admin_add_hostname
      - tests/test_app.py::TestHostnameManagement::test_user_add_own_hostname
    calibrated: derived

  - id: hostname-name-is-globally-unique
    subject: hostname
    disposition: preserve
    given: "a hostname `ok.example.com` exists, owned by user A"
    then: "user B cannot register the same name; the constraint is on the name alone, not on (name, user)"
    evidence: "models.py Hostname.name unique=True"
    source:
      - tests/test_app.py::TestHostnameManagement::test_duplicate_hostname_rejected
    calibrated: agree
    note: >-
      Load-bearing under the multi-tenant design. Two tenants owning the same
      FQDN would race each other's DNS records, so the uniqueness has to
      survive tenancy rather than becoming per-tenant.

  - id: hostname-belongs-to-exactly-one-user
    subject: hostname
    disposition: preserve
    given: "a hostname row"
    then: "it carries exactly one owning user, and destroying the user destroys the hostname"
    evidence: "models.py Hostname.user_id, User.hostnames cascade='all, delete-orphan'"
    source:
      - tests/test_app.py::TestHostnameManagement::test_admin_add_hostname
      - tests/test_app.py::TestHostnameManagement::test_user_add_own_hostname
    calibrated: derived
    note: >-
      In the new design a Device sits between user and hostname (plan 3.1),
      so the surviving rule is "exactly one owner", not "the owner is a user".

  - id: hostname-names-must-be-stored-lowercase
    subject: hostname
    disposition: fix
    given: "a hostname row whose name contains an uppercase letter"
    then: "the host must fold the name to lower case on write, so every row is reachable"
    legacy: >-
      `find_hostname` lowercases the *query* (`hostname_str.lower()`) and
      nothing lowercases the *row*. A row stored as `MiXeD.example.com` is
      therefore unreachable from `/nic/update` under any spelling: the exact
      spelling is lowercased before the lookup and misses, and the lowercase
      spelling misses too. Replayed: both answer `nohost`.
    host: "names are normalised to lower case on write; the lookup keeps lowercasing"
    evidence: "dyndns.py:256 find_hostname; models.py has no normalisation"
    source: []
    calibrated: agree
    note: >-
      protocol_cases.yaml's `update-hostname-lookup-is-case-insensitive` proves
      the *lookup* folds case. It cannot see this, because its fixture stores
      lowercase names -- the failure needs a row the table does not create.

  # -------------------------------------------------------------------------
  # ttl
  # -------------------------------------------------------------------------
  - id: ttl-default-is-60
    subject: ttl
    disposition: preserve
    given: "a hostname is created without an explicit TTL"
    then: "hostname.ttl == 60"
    evidence: "models.py Hostname.ttl default=60; production: 11 of 11 hostnames at 60"
    source:
      - tests/test_app.py::TestTTLManagement::test_hostname_default_ttl
    calibrated: agree

  - id: ttl-is-stored-per-hostname-not-per-domain
    subject: ttl
    disposition: preserve
    given: "two hostnames under one domain"
    then: "each carries its own TTL and changing one does not change the other"
    evidence: "models.py Hostname.ttl; there is no Domain.ttl"
    source:
      - tests/test_app.py::TestTTLManagement::test_hostname_custom_ttl
      - tests/test_app.py::TestTTLManagement::test_admin_create_hostname_with_ttl
      - tests/test_app.py::TestTTLManagement::test_user_create_hostname_with_ttl
      - tests/test_app.py::TestTTLManagement::test_update_ttl_via_backends_page
    calibrated: derived

  - id: ttl-below-30-is-rejected
    subject: ttl
    disposition: preserve
    given: "a TTL of 29 or less is submitted"
    then: "it is refused and the stored TTL does not change"
    evidence: "forms.py NumberRange(min=30, max=86400)"
    source:
      - tests/test_app.py::TestTTLManagement::test_ttl_validation_too_low
    calibrated: agree

  - id: ttl-above-86400-is-rejected
    subject: ttl
    disposition: preserve
    given: "a TTL of 86401 or more is submitted"
    then: "it is refused and the stored TTL does not change"
    evidence: "forms.py NumberRange(min=30, max=86400)"
    source:
      - tests/test_app.py::TestTTLManagement::test_ttl_validation_too_high
    calibrated: agree

  - id: ttl-30-and-86400-are-accepted
    subject: ttl
    disposition: preserve
    given: "a TTL of exactly 30, or exactly 86400"
    then: "it is accepted -- the bounds are inclusive"
    evidence: "wtforms NumberRange is inclusive at both ends"
    source: []
    calibrated: agree
    note: >-
      The legacy suite probes 5 and 100000. Both are far outside the range, so
      neither can tell 30 from 31 -- the boundary itself was never tested. Read
      off the validator instead.

  - id: ttl-reaches-the-create-call
    subject: ttl
    disposition: preserve
    given: "a hostname with ttl=300 is updated"
    then: "the provider's create is called with ttl=300"
    evidence: "dyndns.py:392 createrecords(..., ttl=hn.ttl)"
    source:
      - tests/test_app.py::TestTTLManagement::test_ttl_passed_to_backend
    calibrated: agree
    note: >-
      The legacy test wraps its assertion in `if mock_account.createrecords.called:`.
      Replayed, the call does happen, so the assertion is not currently being
      skipped -- but it is opt-in: were the call to stop happening the test
      would keep passing while asserting nothing. The port drops the guard.

  - id: ttl-is-absent-from-the-delete-call
    subject: ttl
    disposition: preserve
    given: "a hostname with a non-default TTL is deleted"
    then: "the provider's delete is called with no ttl argument at all"
    evidence: "dyndns.py:527 deleterecords(hostname_zones, rtype=rtype)"
    source: []
    calibrated: agree

  - id: ttl-is-not-validated-on-the-ddns-write-path
    subject: ttl
    disposition: preserve
    given: "a hostname row carries a TTL outside 30..86400, written by something other than the form"
    then: "the DDNS path sends it to the provider unchanged; the bounds live in the form only"
    evidence: "dyndns.py reads hn.ttl and never range-checks it"
    source: []
    calibrated: derived
    note: >-
      Directly relevant to the importer: a migrated row is not a form
      submission, so the bounds do not apply to it. Production is uniformly 60
      so nothing is currently out of range, but the importer should assert the
      range rather than assume the source data respected it.

  # -------------------------------------------------------------------------
  # backends -- get_backends() resolution
  # -------------------------------------------------------------------------
  - id: backends-explicit-selection-wins
    subject: backends
    disposition: preserve
    given: "a hostname with a non-empty backend selection, on a domain carrying more backends than are selected"
    then: "resolution returns exactly the selected backends"
    evidence: "models.py Hostname.get_backends()"
    source:
      - tests/test_app.py::TestHostnameBackendSelection::test_get_backends_returns_specific_when_set
      - tests/test_app.py::TestHostnameBackendSelection::test_select_specific_backend
      - tests/test_app.py::TestHostnameBackendSelection::test_user_can_configure_own_hostname_backends
    calibrated: agree

  - id: backends-empty-selection-resolves-to-all-of-the-domains-backends
    subject: backends
    disposition: preserve
    given: "a hostname with an empty backend selection"
    then: "resolution returns every backend on its domain"
    evidence: "models.py Hostname.get_backends() falls through to self.domain.backends"
    source:
      - tests/test_app.py::TestHostnameBackendSelection::test_get_backends_returns_all_domain_when_not_set
      - tests/test_app.py::TestHostnameBackendSelection::test_clear_backend_selection
    calibrated: agree
    note: >-
      This is the production branch. `hostname_backends` is empty for all 11
      hostnames (plan 3.3.1), so every production request takes the fallback.

  - id: backends-empty-selection-tracks-the-domain-live
    subject: backends
    disposition: preserve
    given: "a backend is added to a domain"
    then: >-
      every hostname on that domain with an empty selection picks it up
      immediately, with no per-hostname action; every hostname with a non-empty
      selection does not
    evidence: "models.py get_backends() reads the relationship at call time"
    source: []
    calibrated: agree
    note: >-
      The one place the two branches are behaviourally distinguishable in
      production. With one domain and one backend today both branches return
      the same list, so nothing observable separates them -- and the moment a
      second backend is added to that domain, an empty selection silently
      enables it for all 11 hostnames. That is the correct behaviour to
      preserve, but it must be preserved deliberately.

  - id: backends-a-domain-with-no-backends-resolves-to-none
    subject: backends
    disposition: preserve
    given: "a registered hostname whose domain has no backends"
    then: "resolution returns an empty list"
    evidence: "models.py get_backends(); dyndns.py:355 branches on `if not backends`"
    source:
      - tests/test_app.py::TestDynDNSAPI::test_registered_hostname_no_backend_returns_911
    calibrated: agree
    note: >-
      The wire half -- that this answers `911 {ip}` -- is
      protocol_cases.yaml's `update-911-hostname-with-zero-backends` and
      `delete-911-hostname-with-zero-backends`. This case owns the resolver
      result, not the status.

  - id: backends-resolution-order-decides-the-aggregate-error
    subject: backends
    disposition: preserve
    given: "a hostname resolving to several backends whose statuses differ"
    then: >-
      resolution returns them in a stable order, and that order is what
      "the first status that is neither good nor nochg" is first in
    evidence: "models.py relationship order (primary key); dyndns.py:412 next(...)"
    source: []
    calibrated: agree
    note: >-
      protocol_cases.yaml's `firsterr.example.com` fixture is ordered
      `nochg, 911, dnserr` and its aggregate cases fail if the wrong status
      comes back. Those cases assume a stable resolution order and cannot
      assert one; this case is that assumption made explicit.

  - id: backends-selection-is-owner-scoped
    subject: backends
    disposition: preserve
    given: "user B attempts to configure the backend selection of user A's hostname"
    then: "it is refused"
    evidence: "web_routes.py owner check before the backends form"
    source:
      - tests/test_app.py::TestHostnameBackendSelection::test_user_cannot_configure_others_hostname
    calibrated: derived
    note: >-
      Atrium owns authentication and roles; it does not own row-level ownership
      of host tables. This one stays the host's.

  # -------------------------------------------------------------------------
  # rate_limit
  # -------------------------------------------------------------------------
  - id: rate-limit-is-checked-before-the-request-is-recorded
    subject: rate_limit
    disposition: preserve
    given: "a limit of N per minute and no events yet"
    then: "requests 1..N are accepted and request N+1 is refused"
    evidence: "dyndns.py:306-310 -- check_rate_limit, then record_request"
    source:
      - tests/test_app.py::TestRateLimiting::test_abuse_returned_on_rate_limit
    calibrated: agree
    note: >-
      The order is what makes the limit mean "N allowed per minute" rather than
      "N-1 allowed". Reversing the two lines changes every limit by one and
      nothing on the wire distinguishes the two readings.

  - id: rate-limit-triggers-at-greater-than-or-equal
    subject: rate_limit
    disposition: preserve
    given: "exactly N events in the window and a limit of N"
    then: "the next check refuses"
    evidence: "rate_limiter.py:26 `if recent_minute >= per_minute`"
    source:
      - tests/test_app.py::TestRateLimiting::test_rate_limiter_blocks_after_limit
      - tests/test_app.py::TestRateLimiting::test_rate_limiter_allows_requests
    calibrated: agree

  - id: rate-limit-per-minute-and-per-hour-are-independent
    subject: rate_limit
    disposition: preserve
    given: "a per-minute limit with slack and a per-hour limit that is reached"
    then: "the request is refused on the hour limit alone"
    evidence: "rate_limiter.py:29-37 -- the hour check runs after the minute check passes"
    source:
      - tests/test_app.py::TestRateLimiting::test_rate_limiter_per_hour_limit
    calibrated: agree

  - id: rate-limit-counters-are-per-user
    subject: rate_limit
    disposition: preserve
    given: "user A is at its limit"
    then: "user B is unaffected"
    evidence: "rate_limiter.py filters on user_id"
    source:
      - tests/test_app.py::TestRateLimiting::test_rate_limiter_independent_users
    calibrated: agree
    note: >-
      Plan 2 re-keys this to the device. The invariant that survives is
      "one principal's traffic cannot exhaust another's", with the principal
      changing from user to device.

  - id: rate-limit-window-boundary-is-exclusive
    subject: rate_limit
    disposition: preserve
    given: "one event recorded exactly 60 seconds ago and a limit of 1 per minute"
    then: "the request is accepted -- the event has left the window"
    evidence: "rate_limiter.py:22-24 `created_at > minute_ago`, strict"
    source: []
    calibrated: agree

  - id: rate-limit-a-refused-request-is-not-recorded
    subject: rate_limit
    disposition: preserve
    given: "a client that keeps requesting after being refused"
    then: >-
      the refusals do not extend the block; the block lifts one window after
      the last *accepted* request
    evidence: "dyndns.py:306-310 -- the abuse branch returns before record_request"
    source: []
    calibrated: agree
    note: >-
      A misconfigured router retrying every second is refused for exactly one
      minute, not indefinitely. Recording refusals would turn a transient
      misconfiguration into a permanent outage for that device, and it is a
      one-line change to get wrong.

  - id: rate-limit-events-are-pruned-globally-at-one-hour-on-the-write-path
    subject: rate_limit
    disposition: change
    given: "any user records a request"
    then: "the host prunes rate-limit events on a schedule, not on the write path"
    legacy: >-
      every `record_request` deletes *all users'* rate-limit events older than
      one hour, inline, inside the request. Replayed: user 77's two-hour-old
      row disappears when user 88 records.
    host: >-
      pruning moves to a scheduled job (plan 3.4). The one-hour horizon itself
      is still correct -- the per-hour limit cannot look back further.
    evidence: "rate_limiter.py:12-14"
    source: []
    calibrated: agree

  - id: rate-limit-config-precedence-is-user-then-global-then-hardcoded
    subject: rate_limit
    disposition: preserve
    given: "a request from a user"
    then: >-
      the limits come from that user's own config row if it exists, otherwise
      from the global row, otherwise from the hardcoded 30/500
    evidence: "rate_limiter.py:45-64 check_rate_limit"
    source:
      - tests/test_app.py::TestRateLimiting::test_admin_create_user_rate_limit_override
      - tests/test_app.py::TestRateLimiting::test_admin_delete_user_rate_limit_override
      - tests/test_app.py::TestRateLimiting::test_admin_update_global_rate_limit
    calibrated: agree
    note: >-
      The user lookup is `filter_by(user_id=...)` with no `is_global=False`
      clause, so a row carrying both a user id and `is_global` would be picked
      as that user's override. The host should make the two kinds of row
      structurally exclusive rather than relying on the writer.

  - id: rate-limit-seeded-default-is-30-per-minute-and-500-per-hour
    subject: rate_limit
    disposition: preserve
    given: "a fresh install"
    then: "a global config row exists at 30 requests per minute and 500 per hour"
    evidence: "dyndns.py:150-154"
    source:
      - tests/test_app.py::TestHealthChecks::test_global_rate_limit_created_on_boot
    calibrated: agree

  - id: rate-limit-the-hardcoded-fallback-must-equal-the-seeded-default
    subject: rate_limit
    disposition: preserve
    given: "no global config row exists"
    then: "the fallback limits are the same numbers the seed would have written"
    evidence: "dyndns.py:152 writes 30/500; rate_limiter.py:61-62 falls back to 30/500"
    source: []
    calibrated: derived
    note: >-
      The same pair of numbers is written in two files. Changing one leaves a
      fresh install and a seeded install on different limits, and nothing in
      the legacy suite compares them. The host should derive both from one
      constant, and this case exists so that "they agree" is checkable rather
      than assumed.

  - id: rate-limit-checkip-is-neither-counted-nor-checked
    subject: rate_limit
    disposition: preserve
    given: "any number of requests to /nic/checkip"
    then: "no rate-limit event is recorded and no limit is consulted"
    evidence: "dyndns.py:259-274 -- checkip does not call check_rate_limit or record_request"
    source: []
    calibrated: agree
    note: >-
      protocol_cases.yaml's `checkip-ignores-credentials-entirely` shows checkip
      answers without credentials. It cannot see that the request left no row,
      which is the half that decides whether a chatty client's checkip polling
      eats its update budget. It does not.

  # -------------------------------------------------------------------------
  # event_log
  # -------------------------------------------------------------------------
  - id: event-one-row-per-backend-attempt
    subject: event_log
    disposition: preserve
    given: "one hostname resolving to two backends, in one request"
    then: "two event rows are written, not one"
    evidence: "dyndns.py:364-396 -- log_event is inside the per-backend loop"
    source:
      - tests/test_app.py::TestEvents::test_api_call_creates_event
    calibrated: agree
    note: >-
      The wire shows one line per *hostname*. The log holds one row per
      *backend attempt*. Anyone sizing the events table from the response body
      is out by the backend count -- and plan 3.4's retention estimate depends
      on this number.

  - id: event-response-is-the-per-backend-status-not-the-aggregate
    subject: event_log
    disposition: preserve
    given: "backends returning nochg and then good, aggregating to good"
    then: "the two rows carry nochg and good; no row carries the aggregate"
    evidence: "dyndns.py:394 logs `status` from the individual backend"
    source: []
    calibrated: agree
    note: >-
      A log search for 'what did the client see' cannot be answered by
      filtering `response` -- the aggregate is not stored anywhere. Worth
      deciding deliberately in the rewrite rather than inheriting.

  - id: event-type-is-dns_update-on-update-and-dns_delete-on-delete
    subject: event_log
    disposition: preserve
    given: "a request to /nic/update, and a request to /nic/delete"
    then: "their rows carry event_type dns_update and dns_delete respectively"
    evidence: "dyndns.py log_event call sites"
    source:
      - tests/test_app.py::TestEvents::test_api_call_creates_event
      - tests/test_app.py::TestDynDNSDeleteAPI::test_delete_creates_event
    calibrated: agree

  - id: event-a-rate-limited-delete-is-logged-as-dns_update
    subject: event_log
    disposition: fix
    given: "a request to /nic/delete that is refused by the rate limiter"
    then: "the host logs it as a delete"
    legacy: >-
      it is logged with event_type `dns_update`. Replayed: the delete handler's
      own rate-limit branch passes the literal 'dns_update'. Every other row
      the delete handler writes is `dns_delete`.
    host: "event_type dns_delete, matching the endpoint that was called"
    evidence: "dyndns.py:446 -- copied from the update handler and not adjusted"
    source: []
    calibrated: agree
    note: >-
      Invisible on the wire: both endpoints answer `abuse`, and
      protocol_cases.yaml's `delete-abuse-rate-limited` passes either way. The
      cost is that 'show me this device's refused deletes' silently returns
      nothing, which is exactly the query plan 3.4 exists to make possible.

  - id: event-badauth-writes-no-row
    subject: event_log
    disposition: change
    given: "a request with missing or wrong credentials"
    then: "the host records the failure somewhere an operator can find it"
    legacy: "no row is written at all -- the handler returns before the first log_event"
    host: >-
      atrium's `audit_log` covers authentication (plan 2), so the DDNS event
      table does not have to. But something must own it: a device secret being
      brute-forced currently leaves no trace in either store.
    evidence: "dyndns.py:300-303"
    source: []
    calibrated: agree
    note: >-
      Flagged as a seam. No V1M1 issue owns 'failed /nic/* authentication is
      recorded', and this case is the record that it was noticed rather than
      missed.

  - id: event-911-and-notfqdn-write-no-row
    subject: event_log
    disposition: fix
    given: "a request refused for a missing hostname, an unparseable myip, or a bad hostname syntax"
    then: "the host records it"
    legacy: >-
      no row is written -- every one of those branches returns before the first
      log_event. Replayed: a badauth, a 911 and a notfqdn against a seeded
      database leave the events table at zero rows.
    host: "a row is written, so a misconfigured client is diagnosable from the log"
    evidence: "dyndns.py:319-339"
    source: []
    calibrated: agree
    note: >-
      This is the support case the old service could not answer: a router
      sending a malformed hostname is refused on every attempt and appears in
      the log as complete silence, indistinguishable from a router that stopped
      calling.

  - id: event-username-is-a-snapshot-not-a-join
    subject: event_log
    disposition: change
    given: "an event row"
    then: "the host can search the log by user, device and domain"
    legacy: >-
      `username` is copied into the row at write time and nothing else is.
      Renaming a user leaves old rows naming the old username; there is no
      device column and no domain column.
    host: "indexed user / device / domain columns (plan 3.1, 3.4)"
    evidence: "models.py Event; dyndns.py log_event"
    source:
