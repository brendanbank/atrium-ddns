      having held. The importer should assert the same after loading.

  - id: backend-credentials-are-stored-as-one-encrypted-row-per-key
    subject: storage
    disposition: change
    given: "an aws backend configured with an access key id and a secret"
    then: "the host stores them encrypted, scoped to the owning tenant"
    legacy: >-
      two BackendConfig rows, one per key, each value Fernet-encrypted with an
      application-wide key. Replayed: two rows, and neither stored value equals
      its plaintext.
    host: >-
      SecretBlob + UserSecret at user scope (atrium 0.28, plan 3.1.1). The
      surviving invariant is that no credential is ever at rest in plaintext
      and that the key is not shared across tenants.
    evidence: "models.py BackendConfig, encrypt_value; plan 2 and 3.1.1"
    source:
      - tests/test_app.py::TestDomainManagement::test_save_backend_credentials
    calibrated: agree

  - id: backend-credentials-are-never-redisplayed
    subject: storage
    disposition: preserve
    given: "credentials have been saved and the config screen is opened again"
    then: "the stored secret does not appear in the response in any form"
    evidence: "web_routes.py renders empty password inputs rather than the stored value"
    source:
      - tests/test_app.py::TestDomainManagement::test_backend_config_does_not_leak_credentials
    calibrated: derived
    note: >-
      Ported as a host rule rather than dropped as UI. Under the new design the
      screen is a host bundle calling a host API, so 'the API response does not
      carry the secret' is the assertion that survives -- the markup is
      atrium's, the payload is ours.

  - id: domains-are-tenant-owned-not-admin-only
    subject: storage
    disposition: change
    given: "a non-admin user"
    then: "the user can see and manage their own domains"
    legacy: "domain management is admin-only; a regular user is redirected away"
    host: "users own their domains and their provider credentials (plan 6)"
    evidence: "web_routes.py admin_required on the domain routes; plan 6 decision"
    source:
      - tests/test_app.py::TestAuthorization::test_regular_user_cannot_access_domains
    calibrated: derived
    note: >-
      Kept as a case rather than dropped as `atrium-owns` because atrium owns
      *roles*, not this policy. The legacy test asserts the exact opposite of
      the design, so dropping it silently would have removed the only written
      record that the inversion was deliberate.

  # -------------------------------------------------------------------------
  # auth
  # -------------------------------------------------------------------------
  - id: auth-the-ddns-credential-is-independent-of-any-web-login
    subject: auth
    disposition: preserve
    given: "a principal that cannot log in to the web UI at all"
    then: "/nic/update authenticates it and serves the request"
    evidence: "auth.py authenticate_dyndns_user does not consult web_login"
    source:
      - tests/test_app.py::TestAuthentication::test_web_login_disabled_user_can_use_api
    calibrated: agree
    note: >-
      This is the production shape, not an edge case: all six non-admin users
      have web_login=0 (plan 3.3.1), so the DDNS credential is the only thing
      they have. In the new design it becomes the device secret, and the rule
      is that a device authenticates /nic/* without its owner having an atrium
      login.

  - id: auth-the-ddns-path-never-consults-a-second-factor
    subject: auth
    disposition: preserve
    given: "a principal with TOTP enrolled"
    then: "/nic/update still succeeds on HTTP Basic alone"
    evidence: "dyndns.py:300 calls authenticate_dyndns_user and nothing else"
    source:
      - tests/test_app.py::TestDynDNSAPI::test_no_totp_required_for_api
    calibrated: agree
    note: >-
      protocol_cases.yaml's fixture users have no second factor enrolled, so
      every case in that table passes whether or not the endpoint would demand
      one. The failure this guards against -- routing /nic/* through atrium's
      session auth, which does enforce TOTP -- is invisible to the table and
      would break every router in the field at once.
