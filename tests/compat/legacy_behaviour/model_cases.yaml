  # -------------------------------------------------------------------------
  # ip_tracking
  # -------------------------------------------------------------------------
  - id: tracked-ip-moves-only-on-good-so-last-updated-at-is-not-a-liveness-signal
    subject: ip_tracking
    disposition: preserve
    given: "a client updating every five minutes with an unchanged address"
    then: >-
      last_updated_at does not move, because every one of those updates
      aggregates to nochg
    evidence: "dyndns.py:399-406 -- the persist block is inside `if 'good' in results`"
    source: []
    calibrated: agree
    note: >-
      protocol_cases.yaml records `last_updated_at: unchanged` on the nochg
      case, which is the same fact for one request. This case is what that
      means over time: a perfectly healthy hostname's last_updated_at ages
      without bound. Any future 'stale hostname' alert built on that column
      fires for every healthy hostname in the estate.

  - id: tracked-ip-is-never-cleared-by-a-delete
    subject: ip_tracking
    disposition: preserve
    given: "a hostname whose record is deleted through /nic/delete"
    then: "last_ip_v4 / last_ip_v6 keep their values"
    evidence: "dyndns.py deleteDyndns writes no hostname columns"
    source: []
    calibrated: agree
    note: >-
      Consequence the wire table cannot reach: the health checker only examines
      hostnames with a tracked address, so a deliberately deleted record is
      reported `missing` on every run, forever. Preserved because the
      alternative (clearing on delete) loses the record of what was there, but
      the health checker needs a way to tell 'deleted on purpose' from 'gone'.

  - id: tracked-ip-is-seeded-from-live-dns-at-boot
    subject: ip_tracking
    disposition: change
    given: "a hostname with no tracked address at start-up"
    then: "the host does not resolve it"
    legacy: >-
      start-up resolves A and AAAA for every untracked hostname and writes the
      answers into last_ip_v4 / last_ip_v6, then stamps last_updated_at.
    host: >-
      no boot-time resolution. Tracking is what a client's update wrote, and an
      untracked hostname stays untracked until one arrives.
    evidence: "dyndns.py:162-181"
    source: []
    calibrated: not-replayable
    note: >-
      Bears directly on a premise this milestone is using. "Production is
      IPv6-first -- 10 of 11 hostnames track a v6 address" is read from
      `hostnames.last_ip_v6`, and this block writes that column from *live DNS
      at boot*, not from client traffic. So the 10/11 figure counts hostnames
      that have an AAAA record in the zone, which is not the same population as
      hostnames whose clients send AAAA updates. The instrument for the traffic
      claim is `events.ip_address` on dns_update rows, and it has now been
      read: 448 events, 143 IPv4 against 305 IPv6, on 2026-08-15. The gap
      this note described is closed; the figure it corrects is retracted
      rather than merely refined.
      The conclusion -- exercise AAAA at least as hard as A -- is unaffected
      and is if anything reinforced, since both readings would have to be wrong
      in the same direction to overturn it.

