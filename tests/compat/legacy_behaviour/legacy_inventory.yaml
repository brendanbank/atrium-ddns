# The drop list. Every test in the legacy suite, and what happened to it.
#
# Data only. Generated once from `pytest --collect-only` on the legacy checkout
# so that the file cannot name a test that does not exist, or miss one that
# does, and hand-classified from there.
#
# A silent drop is indistinguishable from an oversight. This file is the record
# that each of the 147 decisions was taken deliberately, and
# `test_legacy_behaviour.py` fails if the four dispositions stop summing to the
# measured total.

version: 1

legacy:
  repo: brendanbank/dyndns-route53
  commit: 5d1c941
  files:
    - tests/test_app.py
    - tests/test_hetzner.py
  # Two instruments, different shapes, both taken on 2026-08-15. See
  # ../README.md, "Counting the legacy suite".
  measured:
    collected: 147      # pytest --collect-only -q
    grepped: 147        # grep -cE '^\s*def test_' over both files
    by_file:
      tests/test_app.py: 121
      tests/test_hetzner.py: 26
  # The issue body and refactor-plan.md 1 both say "~146 tests". 146 is not a
  # count of anything: test_app.py holds 121 and 147 is both files together.
  # refactor-plan.md is outside this issue's declared file list, so the number
  # there is flagged in the PR rather than edited here.
  #
  # protocol_cases.yaml cites the legacy repo at ec605c5; this file cites
  # 5d1c941, its child. `git diff --stat ec605c5 5d1c941` is one file,
  # docker-compose.override.yml.example, and no Python at all -- so the two
  # readings are of the same behaviour.

reasons:
  atrium-owns: >-
    authentication, sessions, TOTP, user CRUD, roles and boot-time admin
    creation. Atrium ships all of it and reimplementing it is the one hard rule
    in docs/new-project/SKILL.md.
  flask-internal: >-
    a template rendering, a redirect, a flash message, a Bootstrap class, a
    static file, or a form POST whose only surviving content is "a row was
    inserted". The host bundle replaces this surface entirely.
  superseded-by-table: >-
    the assertion is already owned, byte-for-byte and more thoroughly, by
    ../protocol_cases.yaml. Porting it would be a second, weaker copy of a
    frozen contract -- and a weaker copy that disagrees is worse than no copy.

counts:
  ported: 67
  dropped:
    atrium-owns: 34
    flask-internal: 27
    superseded-by-table: 19
  dropped_total: 80
  total: 147

