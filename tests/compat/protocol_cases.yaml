  # === GET /nic/update -- divergences 7, 8 and 9 ============================

  - id: update-post-is-405-with-an-html-body
    note: >-
      Divergence 7. POST, PUT, DELETE and PATCH all answer the same 405 and the
      same 153 bytes; POST stands for the family. Werkzeug answers before the
      handler runs, so no update is attempted and no event is written -- the
      405 is the whole observable behaviour. Legacy-only: the body is
      Werkzeug's error page, and a rewrite that reproduced those exact bytes
      would be imitating a framework rather than staying compatible.
    targets: [legacy]
    method: POST
    path: /nic/update
    query: {hostname: ok.example.com, myip: 203.0.113.10}
    covers: [divergence/7-non-get-405, divergence/4-always-200]
    expect:
      status: 405
      content_type: "text/html; charset=utf-8"
      line_count: 6
      body_ends_with_newline: true
      body: |
        <!doctype html>
        <html lang=en>
        <title>405 Method Not Allowed</title>
        <h1>Method Not Allowed</h1>
        <p>The method is not allowed for the requested URL.</p>

  - id: update-post-is-405-on-the-host
    note: >-
      Divergence 7 on the host, and the one that matters most: a rewrite on
      FastAPI answers 405 here for a completely different reason (the route
      declares GET and Starlette refuses the rest), and that coincidence must
      not be mistaken for a compatibility guarantee. Pinning it makes it one.
      With the same caveat as `checkip-post-is-405-on-the-host`: this passes
      today against a host with no /nic/update at all, so it asserts "POST is
      refused", never "the endpoint exists". The 105 red cases beside it are
      what says the endpoint does not exist yet.
    targets: [host]
    method: POST
    path: /nic/update
    query: {hostname: ok.example.com, myip: 203.0.113.10}
    legacy_behaviour: |-
      HTTP 405 with Werkzeug's 153-byte HTML error page,
      Content-Type: text/html; charset=utf-8
    covers: [divergence/7-non-get-405]
    expect:
      status: 405
      content_type: "application/json"
      body: '{"detail":"Method Not Allowed"}'

  - id: update-offline-yes-is-inert-and-never-answers-donator
    note: >-
      Divergence 8. §1.5 lists `offline=YES` as "activates offline redirect for
      the hostname ... requires a credited account" and §1.6 specifies
      `!donator` for a premium feature requested by a non-credited user.
      `offline` never reaches a comparison and `!donator` has zero writers in
      dyndns.py or any provider -- the same family as divergences 2 and 3, and
      the third documented return code the implementation cannot emit.
      Distinct from `update-unknown-parameters-are-ignored`: that case sends
      parameters the document does not define, and this one sends a parameter
      the document defines and does not mark deprecated. The record is updated
      normally, which is what makes this "inert" rather than "absent" -- an
      implementation that recognised `offline` would answer `!donator` or
      suppress the update, and either would fail here.
    path: /nic/update
    query: {hostname: ok.example.com, myip: 203.0.113.10, offline: "YES"}
    covers: [divergence/8-offline-inert-no-donator, update/aggregate-good]
    effects:
      persisted: {last_ip_v4: "203.0.113.10", last_updated_at: set}
      dns: [{backend: good, op: create, rtype: A, ip: 203.0.113.10}]
    expect:
      body: "good 203.0.113.10"

  - id: update-client-ip-does-not-supply-a-missing-myip
    note: >-
      Divergence 9 on the endpoint that writes DNS. `myip` is omitted, so it
      defaults to request.remote_addr, which ProxyFix leaves unparseable. An
      implementation that honoured Client-IP would answer
      `good 198.51.100.5` and would have pointed a DNS record at the address in
      a header nothing validates. The paired case is
      `update-911-no-myip-and-no-client-ip`, which is this request without the
      header; both answer 911, and that they answer the *same* thing is the
      assertion.
    path: /nic/update
    client_ip: null
    headers: {client-ip: "198.51.100.5"}
    query: {hostname: ok.example.com}
    covers: [divergence/9-client-ip-not-honoured, update/myip-defaults-remote-addr]
    effects:
      persisted: none
      dns: []
    expect:
      body: "911"

  # === GET /nic/update -- the HEAD decision =================================

  - id: update-head-runs-the-handler-and-writes-dns
    note: >-
      The legacy behaviour, recorded so that leaving it behind is a decision
      with a measurement under it. Flask adds HEAD to every GET route
      (werkzeug/routing/rules.py: `if "HEAD" not in methods and "GET" in
      methods: methods.add("HEAD")`), and Flask serves HEAD by running the GET
      handler and discarding the body. So this request is a full update:
      Content-Length 18 for the `good 203.0.113.10` that is generated and
      thrown away, and `last_ip_v4` moves. The wire cannot see the write, which
      is why `effects:` carries it.

      **Declaring `methods=["GET"]` does not fix this** -- measured, not
      assumed: with that mutation applied to a throwaway copy, POST and PUT
      become 405 while HEAD stays 200, still updates, and the Allow header
      still reads `OPTIONS, GET, HEAD`.
    targets: [legacy]
    method: HEAD
    path: /nic/update
    query: {hostname: ok.example.com, myip: 203.0.113.10}
    covers: [head/update-refused, update/aggregate-good]
    effects:
      persisted: {last_ip_v4: "203.0.113.10", last_updated_at: set}
      dns: [{backend: good, op: create, rtype: A, ip: 203.0.113.10}]
      event: {event_type: dns_update, response: good}
    expect:
      status: 200
      content_type: "text/plain; charset=utf-8"
      body: ""

  - id: update-head-is-refused-by-the-host
    note: >-
      The decision, in the table. HEAD must be safe (RFC 9110 §9.2.1) and this
      handler is not, so the host does not serve HEAD on /nic/update and
      answers 405. Not a preserved legacy behaviour, and the only wire
      behaviour in this table the rewrite deliberately changes for a reason
      other than removing query-parameter auth. Three things make it cheap:
      no DynDNS client sends HEAD (every one of the cases in this table is a
      GET), FastAPI's APIRoute does not add HEAD to a GET route so *preserving*
      is what would take a deliberate line of code, and the realistic sender is
      an uptime monitor configured with the router's credentials -- measured,
      a HEAD with no `myip` moved the record to the prober's address
      (198.51.100.99 -> 198.51.100.77), so the monitor would point the hostname
      at itself. See plan §1, "HEAD".
    targets: [host]
    method: HEAD
    path: /nic/update
    query: {hostname: ok.example.com, myip: 203.0.113.10}
    legacy_behaviour: |-
      HTTP 200, no body, Content-Length 18 -- and the update is performed
    covers: [head/update-refused]
    effects:
      persisted: none
      dns: []
    expect:
      status: 405
      content_type: "application/json"
      body: ""

  # === GET /nic/update -- query-parameter auth is gone ======================

  - id: update-query-parameter-credentials-are-rejected
    note: >-
      Not a preserved legacy case. Legacy answers `good 203.0.113.10` here; the
      rewrite answers badauth because ?username=&password= is no longer read.
      Runs against the host only, and exists so the removal is asserted rather
      than merely absent. See `deleted_cases` for what was taken out.
    targets: [host]
    path: /nic/update
    auth: {type: none}
    query: {hostname: ok.example.com, myip: 203.0.113.10, username: alice, password: alice-basic-secret}
    legacy_behaviour: "good 203.0.113.10"
    covers: [update/badauth]
    expect:
      body: "badauth"

  - id: update-query-parameter-credentials-do-not-shadow-basic-auth
    note: >-
      Valid Basic credentials plus junk query credentials still succeed --
      the query parameters are not consulted at all, in either direction.
    targets: [host]
    path: /nic/update
    query: {hostname: ok.example.com, myip: 203.0.113.10, username: nobody, password: wrong}
    covers: [update/aggregate-good]
    expect:
      body: "good 203.0.113.10"

