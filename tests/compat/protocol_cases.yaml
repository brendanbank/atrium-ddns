  # === GET /nic/update -- multi-hostname ordering ===========================

  - id: update-multi-hostname-in-request-order
    note: >-
      Paired with update-multi-hostname-in-reverse-request-order. The two
      requests carry the same hostnames and produce different bodies, which is
      what proves the join is in request order rather than sorted, grouped or
      set-ordered. Either case alone would pass against a sorted implementation.
    path: /nic/update
    query: {hostname: "zz-ok.example.com,never-registered.example.com", myip: 203.0.113.10}
    covers: [update/request-order]
    expect:
      body: |-
        good 203.0.113.10
        nohost 203.0.113.10

  - id: update-multi-hostname-in-reverse-request-order
    path: /nic/update
    query: {hostname: "never-registered.example.com,zz-ok.example.com", myip: 203.0.113.10}
    covers: [update/request-order]
