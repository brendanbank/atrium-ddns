  # === GET /nic/delete -- record family selection ===========================

  - id: delete-myip-absent-deletes-both-families
    note: rtype stays None and is passed through to deleterecords as such.
    path: /nic/delete
    query: {hostname: ok.example.com}
    covers: [delete/myip-absent-both-families]
    effects:
      dns: [{backend: good, op: delete, rtype: null, hostname: ok.example.com}]
    expect:
      body: "good"

  - id: delete-myip-v4-deletes-a-only
    path: /nic/delete
    query: {hostname: ok.example.com, myip: 203.0.113.10}
    covers: [delete/myip-selects-family]
    effects:
      dns: [{backend: good, op: delete, rtype: A, hostname: ok.example.com}]
    expect:
      body: "good"

  - id: delete-myip-v6-deletes-aaaa-only
    path: /nic/delete
    query: {hostname: ok.example.com, myip: "2001:db8::1"}
    covers: [delete/myip-selects-family]
    effects:
      dns: [{backend: good, op: delete, rtype: AAAA, hostname: ok.example.com}]
    expect:
      body: "good"

  - id: delete-myip-ipv4-mapped-ipv6-deletes-aaaa-only
    note: >-
      **This case cannot fail on the wire, and that is the finding, not an
      oversight.** #29 measured every legacy-selected case twice -- once as the
      table spells it and once with every IPv4 literal swapped for an IPv6 one
      -- and all 36 executable `/nic/delete` cases answered byte-identically.
      Delete's replies carry no IP suffix (divergence 1), so a host deleting the
      wrong record type passes every delete case in this table, in either
      family. The asymmetry lives entirely in `effects.rtype`, which no runner
      asserts. ::ffff:192.0.2.1 is the literal most likely to be mis-dispatched
      -- measured, it selects AAAA -- so the case is here for the assertion
      V1M2 has to add, and is labelled rather than counted as coverage it is
      not. See `frozen.known_gaps`.
    path: /nic/delete
    query: {hostname: ok.example.com, myip: "::ffff:192.0.2.1"}
    covers: [delete/myip-selects-family]
    effects:
      dns: [{backend: good, op: delete, rtype: AAAA, hostname: ok.example.com}]
    expect:
      body: "good"

  - id: delete-empty-myip-deletes-both-families
    note: myip= is falsy, so the family filter is never set.
    path: /nic/delete
    query: {hostname: ok.example.com, myip: ""}
    covers: [delete/myip-absent-both-families]
    effects:
      dns: [{backend: good, op: delete, rtype: null, hostname: ok.example.com}]
    expect:
      body: "good"

  - id: delete-myip-does-not-default-to-client-ip
    note: >-
      The one real asymmetry with update. Update substitutes remote_addr for a
      missing myip and answers 911 when both are absent; delete never does, so
      the same request succeeds. Paired with
      update-911-no-myip-and-no-client-ip, which is the identical request shape
      on the other endpoint.
    path: /nic/delete
    client_ip: null
    query: {hostname: ok.example.com}
    covers: [delete/myip-absent-both-families]
    effects:
      dns: [{backend: good, op: delete, rtype: null, hostname: ok.example.com}]
    expect:
      body: "good"

