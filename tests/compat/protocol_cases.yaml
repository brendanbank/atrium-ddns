  # === GET /nic/delete -- the HEAD decision =================================

  - id: delete-head-runs-the-handler-and-deletes-records
    note: >-
      The same Flask auto-HEAD as `update-head-runs-the-handler-and-writes-dns`,
      on the endpoint that removes records. Content-Length 4 for the `good`
      that is generated and discarded. Delete persists nothing, so there is no
      column to watch here -- the DNS operation is the whole effect, and it is
      the one the wire cannot see.
    targets: [legacy]
    method: HEAD
    path: /nic/delete
    query: {hostname: ok.example.com}
    covers: [head/update-refused, delete/myip-absent-both-families]
    effects:
      dns: [{backend: good, op: delete, rtype: null, hostname: ok.example.com}]
      event: {event_type: dns_update, response: good}
    expect:
      status: 200
      content_type: "text/plain; charset=utf-8"
      body: ""

  - id: delete-head-is-refused-by-the-host
    note: >-
      The decision applies to both writing endpoints, not just update. A HEAD
      that deletes DNS records is the same defect as a HEAD that rewrites them,
      and leaving delete out would be the seam between the two.
    targets: [host]
    method: HEAD
    path: /nic/delete
    query: {hostname: ok.example.com}
    legacy_behaviour: |-
      HTTP 200, no body, Content-Length 4 -- and the records are deleted
    covers: [head/update-refused]
    effects:
      dns: []
    expect:
      status: 405
      content_type: "application/json"
      body: ""

  - id: delete-query-parameter-credentials-are-rejected
    note: Legacy answers `good` here. See `deleted_cases`.
    targets: [host]
    path: /nic/delete
    auth: {type: none}
    query: {hostname: ok.example.com, username: alice, password: alice-basic-secret}
    legacy_behaviour: "good"
    covers: [delete/auth]
    expect:
      body: "badauth"

# ---------------------------------------------------------------------------
# Deleted cases.
#
# Query-parameter authentication (?username=&password=) is removed in the
# rewrite -- refactor-plan.md §1, "Removed: query-parameter auth". These cases
# were drafted from the legacy behaviour and then deleted. They are recorded
# here, as data, so the deletion is auditable and cannot shrink silently: the
# count in the PR body is the length of this list, and a runner that starts
# executing them will fail because they carry no `expect`.
#
# Do not add `expect` blocks to these. If query-parameter auth is ever
# reinstated, that is a design change to §1 first.
# ---------------------------------------------------------------------------
deleted_cases:
  - id: update-query-param-auth-succeeds
    endpoint: /nic/update
    legacy_behaviour: "?username=alice&password=... with no Authorization header -> good {ip}"
    reason: query-parameter credentials are no longer read

  - id: delete-query-param-auth-succeeds
    endpoint: /nic/delete
    legacy_behaviour: "?username=alice&password=... with no Authorization header -> good"
    reason: query-parameter credentials are no longer read

  - id: update-query-param-auth-wrong-password-badauth
    endpoint: /nic/update
    legacy_behaviour: "?username=alice&password=wrong -> badauth via the query-parameter path"
    reason: >-
      the body is still badauth in the rewrite, but for a different reason --
      the credentials are not read rather than read and rejected. Replaced by
      update-query-parameter-credentials-are-rejected, which is host-only.

  - id: delete-query-param-auth-wrong-password-badauth
    endpoint: /nic/delete
    legacy_behaviour: "?username=alice&password=wrong -> badauth via the query-parameter path"
    reason: as above; replaced by delete-query-parameter-credentials-are-rejected

  - id: update-query-param-username-without-password-badauth
    endpoint: /nic/update
    legacy_behaviour: "?username=alice with no password -> badauth, plus a warning log line"
    reason: query-parameter credentials are no longer read

  - id: delete-query-param-username-without-password-badauth
    endpoint: /nic/delete
    legacy_behaviour: "?username=alice with no password -> badauth, plus a warning log line"
    reason: query-parameter credentials are no longer read

  - id: update-basic-auth-takes-precedence-over-query-params
    endpoint: /nic/update
    legacy_behaviour: >-
      an Authorization header wins over ?username=&password= -- `if (auth)` is
      checked first and the query parameters are not consulted
    reason: >-
      there is no precedence left to test. The surviving positive form is
      update-query-parameter-credentials-do-not-shadow-basic-auth, which asserts
      the query parameters are inert rather than lower-priority.

  - id: delete-basic-auth-takes-precedence-over-query-params
    endpoint: /nic/delete
    legacy_behaviour: an Authorization header wins over ?username=&password=
    reason: as above

  - id: update-query-param-auth-emits-deprecation-warning
    endpoint: /nic/update
    legacy_behaviour: >-
      "credentials passed via query parameters - use HTTP Basic Auth instead"
      is logged at WARNING whenever either query parameter is present
    reason: the warning was the guard for an input that no longer exists

  - id: delete-query-param-auth-emits-deprecation-warning
    endpoint: /nic/delete
    legacy_behaviour: as above, on the delete path
    reason: the warning was the guard for an input that no longer exists

  - id: password-is-scrubbed-from-the-wsgi-environ
    endpoint: "*"
    legacy_behaviour: >-
      the _scrub_password_from_environ before-request hook rewrites
      QUERY_STRING and RAW_URI to password=REDACTED after forcing request.args
      to cache, so view functions still see the real value while gunicorn's
      error log does not
    reason: >-
      the whole leak apparatus -- this hook, the producer-side stripping, the
      Traefik queryparameters.defaultmode setting and the standing Loki query --
      exists only because the password could arrive in a query string. Removing
      the input removes all of it.
