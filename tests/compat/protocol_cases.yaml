  - id: update-unknown-parameters-are-ignored
    note: >-
      The protocol doc says unrecognised parameters may trigger `abuse`. The
      implementation never looks at them.
    path: /nic/update
    query: {hostname: ok.example.com, myip: 203.0.113.10, wildcard: "ON", mx: mail.example.com, offline: "YES", system: dyndns}
    covers: [update/aggregate-good]
    expect:
