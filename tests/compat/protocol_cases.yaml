  # === GET /nic/delete -- hostname resolution, no IP suffix =================

  - id: delete-nohost-unregistered-hostname
    note: >-
      Divergence 1, the other half. Update answers "nohost {ip}" for the same
      condition; delete answers a bare "nohost". A table that reused the update
      expectation here would be asserting the doc, not the behaviour.
