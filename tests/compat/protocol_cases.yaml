# DynDNS v2 compatibility case table.
#
# Data only. No Python, no expressions, no code. A runner (see README.md) loads
# this file, executes `cases` against a base URL, and compares the response
# byte-for-byte with `expect`.
#
# Source of truth is the *behaviour* of `brendanbank/dyndns-route53`'s
# `dyndns.py` at `main` (commit ec605c5), read directly, not
# `docs/DYNDNS-PROTOCOL.md`. Where the two disagree the implementation wins and
# the case carries a `divergence` tag. See README.md.

# ---------------------------------------------------------------------------
# FROZEN at version 4. 2026-09-02.
# Previously: version 3, issue #29, at 131 cases.
#
# v4 changes NO case's wire response and NO case's identity. It amends the
# `persist:` effect of exactly two:
#
#   update-nochg-single-backend        last_ip_v4: unchanged -> "203.0.113.10"
#   update-nochg-single-backend-ipv6   last_ip_v6: unchanged -> "2001:db8:113::20"
#
# Why, and it is a deliberate divergence from `dyndns-route53`:
#
# A `nochg` is produced by `check_hostnameon_server` — the device asserted
# an address and DNS was queried and already answers it. At that moment the
# service knows what the zone carries, from two sources that did not consult
# each other, and legacy threw that knowledge away.
#
# Leaving `last_ip_*` alone is not neutral, because nothing else can repair
# it. The obvious fix — publish the correct address — is the request that
# produces `nochg`, so the wire path could never converge: a name whose zone
# moved on independently stayed wrong for ever, and the board's divergence
# accent stopped meaning anything.
#
# `last_updated_at` is NOT changed by v4. It still moves on `good` alone, so
# it remains a record of the last *change* rather than of the last call —
# the property `tracked-ip-moves-only-on-good-so-last-updated-at-is-not-a-
# liveness-signal` exists to protect.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# FROZEN at version 3. Issue #29, 2026-08-15, in V1M2.
# Previously: version 2, issue #11, closing V1M1, at 114 cases.
#
# V1M2 is measured against this file, so changing it is a deliberate act with a
# PR and not a tidy-up. To change it:
#
#   1. change the cases,
#   2. bump `frozen.version`,
#   3. recompute `frozen.cases` / `frozen.deleted_cases` / `frozen.spec_rows` /
#      `frozen.content_digest`,
#   4. re-run the table against a throwaway legacy instance and record the
#      reading in `baseline.md`.
#
# Steps 2 and 3 are not optional and not on the honour system:
# `test_the_table_is_frozen_at_its_recorded_shape` in `test_protocol.py`
# recomputes all four every gate run and fails naming both values. `version: 1`
# was written by #7 against a 101-case table and was still reading 1 when #25
# left the table at 114, which is the reason the guard exists rather than a
# note asking politely.
#
# Step 2 got its own guard in #29, because at v2 it did not have one. Mutating
# the table AND recomputing all four readings, leaving `version` alone, passed:
# the four readings say "these numbers describe this table", which stays true
# however often the table changes, so `version` was still on the honour system
# one level up from where #11 found it. `frozen.previous` is the outgoing
# freeze recorded as DATA rather than as the prose comment it was first written
# as -- prose cannot be read by a test -- and
# `test_the_version_advances_exactly_when_the_data_does` reads it.
#
# What that guard does NOT do, measured rather than assumed: it cannot see a
# change made at the CURRENT version, because `previous` is the last recorded
# freeze and not the file's last state. Mutating a byte, recomputing the four
# readings and leaving `version: 3` alone still passes. The evasion is
# available exactly once -- the moment anyone bumps the version afterwards,
# `previous` no longer matches and the guard fires. So the freeze is enforced
# at the boundary between versions, not between edits, and the thing that
# closes the remaining gap is a reviewer reading the diff, which is why
# changing this file is a PR.
#
# `content_digest` is sha256 over the *parsed* `cases` and `deleted_cases`
# lists, canonicalised as JSON -- so reflowing a comment or a block scalar does
# not trip it, and changing a single expected byte does. It is a freeze on the
# data, which is what a runner iterates.
# ---------------------------------------------------------------------------
version: 4

frozen:
  issue: 29
  date: 2026-08-15
  milestone: V1M2
  version: 4
  cases: 131
  deleted_cases: 11
  spec_rows: 37
  content_digest: 3d06d86f21bff0a5aa6df135bd70a395bf06039ced2d252b093808f14cc325b5
  # The freeze this one supersedes, as DATA so a test can read it. v3 adds 17
  # cases for address-family coverage and changes none of the 114: checked case
  # by case on the parsed lists, 0 removed and 0 modified. See baseline.md §7.
  previous:
    issue: 29
    milestone: V1M2
    version: 3
    cases: 131
    deleted_cases: 11
    spec_rows: 37
    content_digest: 2add2f37f3b5a41e82bd247353d633c99cdd00b2509de283f1d4ea748d93b83f
  # What the frozen table is known NOT to cover. Recorded here rather than in
  # prose somewhere, because a frozen table that overstates its own coverage is
  # worse than one that is honestly narrow.
  known_gaps:
    - >-
      effects: is data, not an assertion. 25 cases carry a DNS operation or a
      persisted column and no runner asserts either (15 at v2; the accounting
      block prints the selected count every run so the gap stays a number).
      #29 measured how big the hole is instead of describing it: `getiptype`
      was mutated on a throwaway legacy instance to answer "A" for every
      address, so every AAAA in the service became an A, and the whole v3 table
      was run against it. 121 executed, **0 failed**. The record type is
      invisible on the wire on BOTH endpoints -- update's replies carry the
      normalised ADDRESS, never the rtype, and delete's carry neither -- so no
      number of cases in this file can detect it. Closing this needs an
      `effects:` assertion, and it is the single largest thing the table does
      not check.
    - >-
      3 cases carry `rate_limited: true`. That is fixture state, not a request,
      so the runner skips them with the precondition named and they are
      measured out of band -- see baseline.md.
    - >-
      2 host-only cases (`checkip-post-is-405-on-the-host`,
      `update-post-is-405-on-the-host`) pass against a host with NO /nic/*
      routes at all, because a non-GET on an unmatched path meets atrium's
      SPA catch-all, which also declares only GET. They assert "POST is
      refused", never "the endpoint exists". Measured again by #11 against a
      host whose route table contains zero /nic paths: 2 passed, 105 failed.
      Re-measured by #29 at v3 against the same shape of host: **still exactly
      2** passed, 122 failed, 3 skipped of 127 selected. The overstatement did
      not grow with the table, which is the reading that says it is these two
      cases and not a property of adding cases.
    - >-
      the two host-only HEAD cases (`update-head-is-refused-by-the-host`,
      `delete-head-is-refused-by-the-host`) freeze `status: 405`, and the
      natural implementation does not produce it behind atrium's SPA
      catch-all. Bare FastAPI, GET-only route: HEAD -> 405. The same route
      behind atrium's catch-all mount: HEAD -> **404**. The mount alone, no
      /nic route at all: HEAD -> 404. Decided in V1M2 that this entry keeps
      the 405 and that V1M2 writes a deliberate HEAD handler, which #16 did.
      **The middle reading used to say 200 -- "the catch-all serves it" --
      and that reason was wrong.** #16 measured 404 against
      `app.static.SPAStaticFiles` as shipped in atrium:0.28 and #18
      re-measured it four ways at close-out: the SPA fallback to index.html
      is guarded by `scope["method"] == "GET"`, so a HEAD miss re-raises the
      404 rather than being served the shell; a stock
      `StaticFiles(html=True)` answers 404 too, for the different reason that
      it has no arbitrary-path fallback at all; and over the wire this
      stack answers HEAD 404 / GET 200 / POST 405 on any unrouted path. The
      *decision* and the code are unaffected -- 404 is no more the frozen 405
      than 200 was -- but the wrong reason pointed at a fix that does not
      work: if the catch-all "serves" HEAD, making it decline non-GET reads
      as the remedy, and it already declines non-GET. A Mount is a FULL route
      match whatever it then answers, so the route's own 405 never runs. The
      only thing that produces the frozen 405 is the hand-written HEAD
      handler. Same shadowing mechanism as the two vacuous passes above,
      different status.
    - >-
      this `known_gaps` list is NOT covered by `frozen.content_digest`, which
      is sha256 over the parsed `cases` and `deleted_cases` only. Correcting
      an entry here is therefore not a re-freeze and must NOT be spelled as
      a version bump: #18 tried it and
      `test_the_version_advances_exactly_when_the_data_does` refuses in its
      own words -- *"the data did not move, so there is nothing to
      re-freeze: either the change was lost, or the bump was reflexive"* --
      because `previous.content_digest` would equal `frozen.content_digest`.
      #16 declined to correct the HEAD entry above on the stated grounds
      that "`known_gaps` is inside the digest, so correcting it is a version
      bump"; that premise is false in both halves and it is the reason the
      wrong reason survived an extra issue. What guards this list instead is
      a PR review plus, for any entry making a claim that can be executed, a
      test: the HEAD readings above are now asserted by
      `test_the_head_refusal_does_not_fall_out_of_the_framework` in
      `backend/tests/test_router_nic.py`. Prose that can be measured belongs
      in a guard, not in a digest.
    - >-
      address family, v3. The v6 share of the table is 20 of 131 cases (15.3%):
      18 carry a parseable IPv6 literal and 2 more carry an IPv6-SHAPED literal
      the service must refuse. 107 are IPv4-only and 4 carry no address at all.
      At v2 the same instrument read 4 of 114 (3.5%), so the v6 share is 4.4x
      what it was. It is NOT 68%, and it is deliberately not: see the next entry
      for why the table's ratio is not the traffic's ratio, and baseline.md §7
      for the measurement.
    - >-
      why 15.3% and not §3.3.1's 68%. Production traffic is 143 IPv4 / 305 IPv6
      events, but a case table is not a traffic sample -- 36 near-identical
      IPv4 update cases do not cover IPv4 thirty-six times, they cover one
      mechanism thirty-six times. #29 measured which cases the family can reach
      at all, by replaying every legacy-selected executable case twice against a
      throwaway legacy instance, once as spelled and once with every IPv4
      literal swapped for an IPv6 one: at v2, of 104 executable cases 36 changed
      their reply, 63 were swapped and answered identically, and 5 carried no
      IPv4 literal to swap. Coverage is therefore stated per MECHANISM, and the mechanisms
      are enumerable. `/nic/update` interpolates the address after five status
      tokens: IPv6 covered 1 of 5 (`good` only) at v2 and covers 5 of 5 at v3.
      `/nic/checkip` echoes it in two formats: 1 of 2 at v2, 2 of 2 at v3.
      Family-specific parse REFUSALS: 3 IPv4-shaped and 0 IPv6-shaped at v2, 3
      and 3 at v3. Chasing 68% would have meant adding ~30 more cases that
      repeat mechanisms already covered in both families, and padding a table to
      fix a ratio is worse than the imbalance.
    - >-
      `/nic/delete` is family-blind on the wire ENTIRELY, which is why it got 2
      of the 17 new cases and not a proportional share. Delete's replies carry
      no IP suffix at all (divergence 1), so of its 36 executable cases at v2
      the IPv4-to-IPv6 swap above changed exactly ZERO replies -- while the DNS
      operation underneath changed rtype from A to AAAA, read from the stub
      provider's own call log. Update is blind to the record TYPE too (see the
      first gap) but not to the ADDRESS, which it interpolates into every line;
      delete is blind to both, so its family cases can only ever assert the
      parse. The 2 added are one for the v6 parse branch -- delete reaches it
      through its own `if myip:` block, which update's cases never execute --
      and `delete-myip-ipv4-mapped-ipv6-deletes-aaaa-only`, whose own `note:`
      says it cannot fail on the wire. Adding more would have been padding.

# ---------------------------------------------------------------------------
# Spec rows. Every row of refactor-plan.md §1's three tables, given an id so
# that "every row has at least one case" is checkable from the data rather than
# asserted in prose. A case names the rows it covers in `covers`.
# ---------------------------------------------------------------------------
spec_rows:
  # §1 `GET /nic/checkip`
  checkip/default: "default -> Current IP Check HTML, text/html"
  checkip/format-plain: "?format=plain -> bare {ip}, text/plain"
  checkip/remote-addr-unparseable: "remote_addr not parseable as an IP -> empty IP"

  # §1 `GET /nic/update`
  update/badauth: "missing / wrong credentials, or inactive user -> badauth"
  update/abuse: "rate limit exceeded -> abuse"
  update/no-hostname-911: "no hostname parameter -> 911"
  update/myip-unparseable-911: "myip present but unparseable -> 911"
  update/notfqdn: "hostname fails the label regex, or the comma list has an empty element -> notfqdn"
  update/nohost: "hostname not owned by the caller -> nohost {ip}"
  update/no-backends-911: "hostname owned, but zero backends -> 911 {ip}"
  update/backend-no-credentials-911: "backend row has no stored credentials -> contributes 911"
  update/backend-unknown-service-911: "backend service name unknown to the factory -> contributes 911"
  update/backend-out-of-zone-nohost: "hostname is not inside the backend's zone -> contributes nohost"
  update/backend-status: "backend returned good / unchanged / error -> contributes good / nochg / dnserr"
  update/aggregate-good: "any good -> good {ip}, and last_ip_v4/last_ip_v6 + last_updated_at are persisted"
  update/aggregate-nochg: "all nochg -> nochg {ip}"
  update/aggregate-other: "otherwise -> {first non-good/nochg status} {ip}"
  update/myip-defaults-remote-addr: "myip defaults to remote_addr when omitted"
  update/updatetype-ignored: "updatetype is accepted, warned about, and ignored"
  update/request-order: "one line per requested hostname, newline-joined, in request order"

  # §1 `GET /nic/delete`
  delete/auth: "same auth as update"
  delete/rate-limit: "same rate limit as update"
  delete/hostname-resolution: "same hostname resolution as update"
  delete/no-ip-suffix: "response codes carry no IP suffix -- good, nochg, nohost, 911"
  delete/myip-selects-family: "myip present => delete only the matching family"
  delete/myip-absent-both-families: "myip absent => delete both A and AAAA"

  # §1 "Deliberate divergences from the protocol doc"
  divergence/1-nohost-ip-suffix: "nohost {ip} on update, bare nohost on delete"
  divergence/2-no-badagent: "User-Agent is never inspected"
  divergence/3-no-numhost: "there is no 20-hostname cap"
  divergence/4-always-200: "everything is HTTP 200, badauth included -- true of every case here, all of which are GET; bounded by divergence/7"
  divergence/5-single-label: "a single label with no dot passes the regex and falls through to nohost"
  divergence/6-regex-newline-anchor: "a trailing newline in a label passes the regex ($ matches before it) and falls through to nohost"

  # Three more, found by issue #9 sweeping docs/DYNDNS-PROTOCOL.md §1 clause by
  # clause after the table was frozen, and added here by issue #25. All three
  # are `preserve`, on the same grounds as 2, 3, 5 and 6.
  divergence/7-non-get-405: "non-GET methods answer HTTP 405 with the framework's HTML body, not badagent (§1.3)"
  divergence/8-offline-inert-no-donator: "offline=YES is accepted and silently ignored, and !donator has no writer anywhere (§1.5, §1.6)"
  divergence/9-client-ip-not-honoured: "Client-IP is not consulted for IP detection; only X-Forwarded-For is (§1.7)"

  # §1 "HEAD is refused where the handler is not safe" -- a decision, not a
  # divergence: docs/DYNDNS-PROTOCOL.md says nothing about HEAD.
  head/checkip-preserved: "HEAD /nic/checkip -> 200, headers only, no body. The handler is read-only, so HEAD is safe and is preserved"
  head/update-refused: "HEAD /nic/update and /nic/delete -> 405 on the host. Legacy runs the handler and writes DNS with no body to say so"

# ---------------------------------------------------------------------------
# Fixture world. One world, shared by every case; each hostname is configured
# to exercise exactly one backend condition, so no case has to describe its own
# universe. The runner builds this once per target.
# ---------------------------------------------------------------------------
fixture:
  users:
    - name: alice
      username: alice
      password: alice-basic-secret
      active: true
    - name: carol
      username: carol
      password: carol-basic-secret
      active: true
    - name: dave
      username: dave
      password: dave-basic-secret
      active: false

  # `service: stub` is a provider the account factory knows and whose result is
  # scripted by `result`. `service: no-such-service` is deliberately absent from
  # the factory. `credentials: absent` models a backend row with nothing stored.
  backends:
    - {name: good, service: stub, zone: example.com, credentials: present, result: good}
    - {name: nochg-a, service: stub, zone: example.com, credentials: present, result: nochg}
    - {name: nochg-b, service: stub, zone: example.com, credentials: present, result: nochg}
    - {name: dnserr, service: stub, zone: example.com, credentials: present, result: dnserr}
    - {name: no-credentials, service: stub, zone: example.com, credentials: absent, result: null}
    - {name: unknown-service, service: no-such-service, zone: example.com, credentials: present, result: null}
    - {name: wrong-zone, service: stub, zone: elsewhere.example.org, credentials: present, result: null}

  hostnames:
    - {name: ok.example.com, owner: alice, backends: [good]}
    - {name: zz-ok.example.com, owner: alice, backends: [good]}
    - {name: nochg.example.com, owner: alice, backends: [nochg-a]}
    - {name: dnserr.example.com, owner: alice, backends: [dnserr]}
    - {name: nobackend.example.com, owner: alice, backends: []}
    - {name: nocreds.example.com, owner: alice, backends: [no-credentials]}
    - {name: unknownsvc.example.com, owner: alice, backends: [unknown-service]}
    - {name: outofzone.example.com, owner: alice, backends: [wrong-zone]}
    - {name: mixed.example.com, owner: alice, backends: [dnserr, good]}
    - {name: allnochg.example.com, owner: alice, backends: [nochg-a, nochg-b]}
    - {name: firsterr.example.com, owner: alice, backends: [nochg-a, no-credentials, dnserr]}
    - {name: carols.example.com, owner: carol, backends: [good]}

# ---------------------------------------------------------------------------
# Defaults applied to every case that does not override them.
# ---------------------------------------------------------------------------
defaults:
  method: GET
  client_ip: 203.0.113.10
  auth: {type: basic, username: alice, password: alice-basic-secret}
  rate_limited: false
  targets: [legacy, host]
  expect:
    status: 200
    content_type: "text/plain; charset=utf-8"

# ---------------------------------------------------------------------------
# Cases.
# ---------------------------------------------------------------------------
cases:

  # === GET /nic/checkip =====================================================

  - id: checkip-default-is-html
    path: /nic/checkip
    auth: {type: none}
    query: {}
    covers: [checkip/default, divergence/4-always-200]
    expect:
      status: 200
      content_type: "text/html; charset=utf-8"
      body: "<html><head><title>Current IP Check</title></head><body>Current IP Address: 203.0.113.10</body></html>"

  - id: checkip-format-plain
    path: /nic/checkip
    auth: {type: none}
    query: {format: plain}
    covers: [checkip/format-plain]
    expect:
      body: "203.0.113.10"

  - id: checkip-format-plain-is-exact-match-only
    note: >-
      `fmt == "plain"` is an exact string comparison, so any other value --
      including a different case -- falls back to HTML.
    path: /nic/checkip
    auth: {type: none}
    query: {format: PLAIN}
    covers: [checkip/default]
    expect:
      status: 200
      content_type: "text/html; charset=utf-8"
      body: "<html><head><title>Current IP Check</title></head><body>Current IP Address: 203.0.113.10</body></html>"

  - id: checkip-unknown-format-falls-back-to-html
    path: /nic/checkip
    auth: {type: none}
    query: {format: json}
    covers: [checkip/default]
    expect:
      status: 200
      content_type: "text/html; charset=utf-8"
      body: "<html><head><title>Current IP Check</title></head><body>Current IP Address: 203.0.113.10</body></html>"

  - id: checkip-unparseable-remote-addr-plain
    path: /nic/checkip
    auth: {type: none}
    client_ip: null
    query: {format: plain}
    covers: [checkip/remote-addr-unparseable]
    expect:
      body: ""

  - id: checkip-unparseable-remote-addr-html
    note: >-
      §1's table said "empty string" for this row without qualifying the format.
      That is only true for ?format=plain. In the default HTML mode the wrapper
      is still emitted with an empty IP -- the body is 90 bytes, not 0. §1 has
      been corrected. (This note read 91 until #9 measured it three ways --
      Content-Length, wc -c, and len() of the expect.body below -- and #25
      corrected the count here and in §1. The `body:` was right throughout;
      only the two prose counts were wrong.)
    path: /nic/checkip
    auth: {type: none}
    client_ip: null
    query: {}
    covers: [checkip/remote-addr-unparseable, checkip/default]
    expect:
      status: 200
      content_type: "text/html; charset=utf-8"
      body: "<html><head><title>Current IP Check</title></head><body>Current IP Address: </body></html>"

  - id: checkip-ipv6-is-normalised
    note: >-
      The body carries str(ipaddress.ip_address(...)), not the spelling the
      client sent. 2001:0db8:0000::1 comes back as 2001:db8::1.
    path: /nic/checkip
    auth: {type: none}
    client_ip: "2001:0db8:0000::1"
    query: {format: plain}
    covers: [checkip/format-plain]
    expect:
      body: "2001:db8::1"

  - id: checkip-ipv6-default-is-html
    note: >-
      The v6 half of `checkip-default-is-html`. Before issue #29 the only v6
      checkip case was ?format=plain, so the HTML wrapper -- the DEFAULT mode,
      and the one an unmodified router hits -- was asserted for IPv4 only. 106
      bytes against the v4 case's 102; the wrapper is byte-identical and only
      the address differs.
    path: /nic/checkip
    auth: {type: none}
    client_ip: "2001:db8:113::20"
    query: {}
    covers: [checkip/default]
    expect:
      status: 200
      content_type: "text/html; charset=utf-8"
      body: "<html><head><title>Current IP Check</title></head><body>Current IP Address: 2001:db8:113::20</body></html>"

  - id: checkip-ipv4-mapped-ipv6-is-not-unwrapped
    note: >-
      ::ffff:192.0.2.1 is an IPv6Address whose str() keeps the dotted tail, so
      the body carries the mapped spelling and NOT the 192.0.2.1 it wraps.
      Measured against the legacy service, not reasoned from the standard: an
      implementation calling .ipv4_mapped, or dispatching on "does it contain a
      dot", answers 192.0.2.1 here and fails. Paired with
      update-myip-ipv4-mapped-ipv6-stays-an-aaaa-record, which is the same
      literal on the endpoint where it also picks the record type.
    path: /nic/checkip
    auth: {type: none}
    client_ip: "::ffff:192.0.2.1"
    query: {format: plain}
    covers: [checkip/format-plain]
    expect:
      body: "::ffff:192.0.2.1"

  - id: checkip-ignores-credentials-entirely
    note: Unauthenticated endpoint -- wrong credentials are neither consulted nor rejected.
    path: /nic/checkip
    auth: {type: basic, username: alice, password: wrong}
    query: {format: plain}
    covers: [checkip/format-plain]
    expect:
      body: "203.0.113.10"

  # === GET /nic/checkip -- divergence 9, and the HEAD decision ==============

  - id: checkip-client-ip-header-is-not-honoured
    note: >-
      Divergence 9. §1.7 says "if the client sends X-Forwarded-For or Client-IP
      headers, those values are returned instead". ProxyFix reads only
      X-Forwarded-For, so half the clause is implemented. The header is sent
      here with an unparseable X-Forwarded-For, so an implementation that
      honoured Client-IP *as a fallback* would answer 198.51.100.5 and this
      case would fail: the assertion is that the header is inert, not that it
      is absent.
    path: /nic/checkip
    auth: {type: none}
    client_ip: null
    headers: {client-ip: "198.51.100.5"}
    query: {format: plain}
    covers: [divergence/9-client-ip-not-honoured, checkip/remote-addr-unparseable]
    expect:
      body: ""

  - id: checkip-client-ip-does-not-shadow-x-forwarded-for
    note: >-
      Divergence 9, the other direction. Both headers present and disagreeing:
      X-Forwarded-For wins because Client-IP is never read. An implementation
      that preferred Client-IP -- which §1.7 lists first -- would answer
      198.51.100.5.
    path: /nic/checkip
    auth: {type: none}
    headers: {client-ip: "198.51.100.5"}
    query: {format: plain}
    covers: [divergence/9-client-ip-not-honoured, checkip/format-plain]
    expect:
      body: "203.0.113.10"

  - id: checkip-head-returns-headers-and-no-body
    note: >-
      HEAD is preserved on checkip and only on checkip. The handler is
      read-only, so HEAD is safe in the RFC 9110 sense and a monitoring probe
      is exactly what it is for. Content-Length is the full 102 bytes of the
      HTML wrapper; the body is empty because HEAD suppresses it. See
      `head/update-refused` for the endpoints where this is NOT preserved --
      FastAPI's APIRoute does not add HEAD to a GET route, so the host must
      declare it here and must not declare it there.
    method: HEAD
    path: /nic/checkip
    auth: {type: none}
    query: {}
    covers: [head/checkip-preserved, checkip/default]
    expect:
      status: 200
      content_type: "text/html; charset=utf-8"
      body: ""

  - id: checkip-post-is-405-with-an-html-body
    note: >-
      Divergence 7. §1.3 says "other HTTP methods are not supported and trigger
      a badagent return code"; Flask's default methods are GET/HEAD/OPTIONS and
      no route in dyndns.py overrides them, so Werkzeug answers 405 before any
      handler runs. This is the case that BOUNDS divergence 4: "everything is
      HTTP 200" is true of all 101 GET cases in this table and false of the
      endpoint. Legacy-only because the body below is Werkzeug's error page,
      not the service's -- see `checkip-post-is-405-on-the-host` for what the
      rewrite must answer, and note that only the *status* is common to both.
    targets: [legacy]
    method: POST
    path: /nic/checkip
    auth: {type: none}
    query: {}
    covers: [divergence/7-non-get-405]
    expect:
      status: 405
      content_type: "text/html; charset=utf-8"
      line_count: 6
      body_ends_with_newline: true
      # `|` and not `|-`: this body ends in a newline. Every DynDNS body in
      # this table does not, which is why the rest of the file uses `|-`.
      body: |
        <!doctype html>
        <html lang=en>
        <title>405 Method Not Allowed</title>
        <h1>Method Not Allowed</h1>
        <p>The method is not allowed for the requested URL.</p>

  - id: checkip-post-is-405-on-the-host
    note: >-
      Divergence 7 on the host. The status is the compatibility requirement and
      is the same 405; the rendering is the framework's and is not. This body
      was measured against this repository's own running stack (POST to a
      GET-only path -> 405, application/json, 31 bytes) rather than read out of
      FastAPI's source, so a change to it is a decision someone has to take
      here rather than a coincidence nobody notices.

      **This case already passes against a host that has no /nic/* routes at
      all** -- measured on 25_overnight, where it and its update sibling were 2
      of the 110 host cases green, beside 105 red and 3 skipped. A 405 is what
      the SPA catch-all answers for a non-GET too, and nothing on the wire
      distinguishes "no route" from "GET-only route". It is recorded rather
      than dressed up: this case cannot tell you /nic/checkip exists, and its
      whole job is to go red if that route is ever declared with POST.
    targets: [host]
    method: POST
    path: /nic/checkip
    auth: {type: none}
    query: {}
    legacy_behaviour: |-
      HTTP 405 with Werkzeug's 153-byte HTML error page,
      Content-Type: text/html; charset=utf-8
    covers: [divergence/7-non-get-405]
    expect:
      status: 405
      content_type: "application/json"
      body: '{"detail":"Method Not Allowed"}'

  # === GET /nic/update -- authentication and rate limiting ==================

  - id: update-badauth-no-credentials
    path: /nic/update
    auth: {type: none}
    query: {hostname: ok.example.com, myip: 203.0.113.10}
    covers: [update/badauth, divergence/4-always-200]
    expect:
      status: 200
      content_type: "text/plain; charset=utf-8"
      body: "badauth"

  - id: update-badauth-wrong-password
    path: /nic/update
    auth: {type: basic, username: alice, password: not-alices-password}
    query: {hostname: ok.example.com, myip: 203.0.113.10}
    covers: [update/badauth]
    expect:
      body: "badauth"

  - id: update-badauth-unknown-user
    path: /nic/update
    auth: {type: basic, username: nobody, password: whatever}
    query: {hostname: ok.example.com, myip: 203.0.113.10}
    covers: [update/badauth]
    expect:
      body: "badauth"

  - id: update-badauth-inactive-user
    path: /nic/update
    auth: {type: basic, username: dave, password: dave-basic-secret}
    query: {hostname: ok.example.com, myip: 203.0.113.10}
    covers: [update/badauth]
    expect:
      body: "badauth"

  - id: update-badauth-empty-password
    note: authenticate_dyndns_user returns None when username or password is falsy.
    path: /nic/update
    auth: {type: basic, username: alice, password: ""}
    query: {hostname: ok.example.com, myip: 203.0.113.10}
    covers: [update/badauth]
    expect:
      body: "badauth"

  - id: update-badauth-precedes-911
    note: Auth is checked before the hostname parameter, so a bad credential wins.
    path: /nic/update
    auth: {type: none}
    query: {myip: 203.0.113.10}
    covers: [update/badauth, update/no-hostname-911]
    expect:
      body: "badauth"

  - id: update-abuse-rate-limited
    path: /nic/update
    rate_limited: true
    query: {hostname: ok.example.com, myip: 203.0.113.10}
    covers: [update/abuse]
    expect:
      body: "abuse"

  - id: update-abuse-precedes-911
    note: Rate limiting is checked before the hostname parameter.
    path: /nic/update
    rate_limited: true
    query: {myip: 203.0.113.10}
    covers: [update/abuse, update/no-hostname-911]
    expect:
      body: "abuse"

  # === GET /nic/update -- request validation ================================

  - id: update-911-missing-hostname
    path: /nic/update
    query: {myip: 203.0.113.10}
    covers: [update/no-hostname-911]
    expect:
      body: "911"

  - id: update-911-empty-hostname
    note: >-
      hostname= is falsy, so `not hostnames` fires before the regex ever runs.
      An empty hostname is 911, not notfqdn.
    path: /nic/update
    query: {hostname: "", myip: 203.0.113.10}
    covers: [update/no-hostname-911]
    expect:
      body: "911"

  - id: update-911-unparseable-myip
    path: /nic/update
    query: {hostname: ok.example.com, myip: notanip}
    covers: [update/myip-unparseable-911]
    expect:
      body: "911"

  - id: update-911-myip-with-prefix-length
    path: /nic/update
    query: {hostname: ok.example.com, myip: "203.0.113.10/32"}
    covers: [update/myip-unparseable-911]
    expect:
      body: "911"

  - id: update-911-myip-with-leading-zeros
    note: >-
      ipaddress.ip_address rejects zero-padded octets on Python >= 3.9.5, which
      is what the deployed legacy service runs (3.12).
    path: /nic/update
    query: {hostname: ok.example.com, myip: "192.168.001.1"}
    covers: [update/myip-unparseable-911]
    expect:
      body: "911"

  - id: update-911-myip-ipv6-with-prefix-length
    note: >-
      The v6 half of update-911-myip-with-prefix-length. Same answer, different
      code path in any implementation that parses the two families separately:
      a host whose v4 parser rejects /32 while its v6 parser falls back to
      ip_network passes the v4 case and fails this one. The v4 case cannot see
      that, which is why this is coverage rather than a duplicate.
    path: /nic/update
    query: {hostname: ok.example.com, myip: "2001:db8::1/64"}
    covers: [update/myip-unparseable-911]
    expect:
      body: "911"

  - id: update-911-myip-ipv6-shaped-but-unparseable
    note: >-
      Three colons in a row. `notanip` is refused by any parser at all; this one
      is refused only by a parser that actually understands v6 grouping, so it
      is the case that bites an over-permissive one.
    path: /nic/update
    query: {hostname: ok.example.com, myip: "2001:db8:::1"}
    covers: [update/myip-unparseable-911]
    expect:
      body: "911"

  - id: update-911-myip-checked-before-hostname-syntax
    note: IP validation runs before isvalidhostname, so 911 beats notfqdn.
    path: /nic/update
    query: {hostname: "_dmarc.example.com", myip: notanip}
    covers: [update/myip-unparseable-911, update/notfqdn]
    expect:
      body: "911"

  - id: update-911-no-myip-and-no-client-ip
    note: >-
      myip defaults to remote_addr; when both are absent `not myip` fires and
      the answer is 911 even though the hostname is valid and registered.
    path: /nic/update
    client_ip: null
    query: {hostname: ok.example.com}
    covers: [update/no-hostname-911, update/myip-defaults-remote-addr]
    expect:
      body: "911"

  - id: update-notfqdn-underscore-label
    path: /nic/update
    query: {hostname: "_dmarc.example.com", myip: 203.0.113.10}
    covers: [update/notfqdn]
    expect:
      body: "notfqdn"

  - id: update-notfqdn-leading-hyphen
    path: /nic/update
    query: {hostname: "-bad.example.com", myip: 203.0.113.10}
    covers: [update/notfqdn]
    expect:
      body: "notfqdn"

  - id: update-notfqdn-trailing-hyphen
    path: /nic/update
    query: {hostname: "bad-.example.com", myip: 203.0.113.10}
    covers: [update/notfqdn]
    expect:
      body: "notfqdn"

  - id: update-notfqdn-empty-label
    path: /nic/update
    query: {hostname: "example..com", myip: 203.0.113.10}
    covers: [update/notfqdn]
    expect:
      body: "notfqdn"

  - id: update-notfqdn-label-over-63-chars
    path: /nic/update
    query:
      hostname: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.example.com"
      myip: 203.0.113.10
    covers: [update/notfqdn]
    expect:
      body: "notfqdn"

  - id: update-notfqdn-name-over-255-chars
    path: /nic/update
    query:
      hostname: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.example.com"
      myip: 203.0.113.10
    covers: [update/notfqdn]
    expect:
      body: "notfqdn"

  - id: update-notfqdn-empty-element-in-list
    path: /nic/update
    query: {hostname: "ok.example.com,,zz-ok.example.com", myip: 203.0.113.10}
    covers: [update/notfqdn]
    expect:
      body: "notfqdn"

  - id: update-notfqdn-trailing-comma
    note: A trailing comma yields an empty final element, which is rejected wholesale.
    path: /nic/update
    query: {hostname: "ok.example.com,", myip: 203.0.113.10}
    covers: [update/notfqdn]
    expect:
      body: "notfqdn"

  - id: update-notfqdn-one-bad-element-rejects-the-whole-request
    note: >-
      notfqdn is a single-line whole-request answer, not a per-hostname line --
      a valid hostname alongside an invalid one produces no line of its own.
    path: /nic/update
    query: {hostname: "ok.example.com,_dmarc.example.com", myip: 203.0.113.10}
    covers: [update/notfqdn, update/request-order]
    expect:
      body: "notfqdn"

  # === GET /nic/update -- hostname resolution ===============================

  - id: update-nohost-unregistered-hostname
    note: The IP suffix is divergence 1 -- the protocol doc says bare `nohost`.
    path: /nic/update
    query: {hostname: never-registered.example.com, myip: 203.0.113.10}
    covers: [update/nohost, divergence/1-nohost-ip-suffix]
    expect:
      body: "nohost 203.0.113.10"

  - id: update-nohost-unregistered-hostname-ipv6
    note: >-
      Divergence 1 with a v6 suffix. The suffix is str(validated_ip), so this is
      the `nohost` half of the five status tokens the update handler can
      interpolate an address into; before #29 only `good` had ever been
      asserted with a v6 address.
    path: /nic/update
    query: {hostname: never-registered.example.com, myip: "2001:db8:113::20"}
    covers: [update/nohost, divergence/1-nohost-ip-suffix]
    expect:
      body: "nohost 2001:db8:113::20"

  - id: update-nohost-hostname-owned-by-another-user
    note: find_hostname filters by user_id, so another tenant's hostname is invisible.
    path: /nic/update
    query: {hostname: carols.example.com, myip: 203.0.113.10}
    covers: [update/nohost, divergence/1-nohost-ip-suffix]
    expect:
      body: "nohost 203.0.113.10"

  - id: update-nohost-single-label-no-dot
    note: >-
      Divergence 5. `foo`.split(".") is ["foo"], which the label regex accepts,
      so validation passes and the request falls through to the hostname lookup.
      The protocol doc would call this notfqdn.
    path: /nic/update
    query: {hostname: "foo", myip: 203.0.113.10}
    covers: [update/nohost, divergence/5-single-label]
    expect:
      body: "nohost 203.0.113.10"

  - id: update-nohost-trailing-newline-in-label
    note: >-
      Divergence 6, found by this issue and not listed in §1 as written. The
      label regex ends in `$`, which in Python matches before a trailing
      newline, so "foo\n" passes validation. isvalidhostname returns the
      *unstripped* element, so the lookup then misses and the answer is nohost.
      Preserve, for the same reason as divergence 5 -- both spellings already
      end at nohost, so preserving costs nothing and a "fix" would turn a
      per-hostname nohost line into a whole-request notfqdn.
    path: /nic/update
    query: {hostname: "foo\n", myip: 203.0.113.10}
    covers: [update/nohost, divergence/6-regex-newline-anchor]
    expect:
      body: "nohost 203.0.113.10"

  - id: update-nohost-trailing-dot
    note: >-
      isvalidhostname strips one trailing dot for the regex check but returns
      the original element, so the lookup is for "ok.example.com." and misses.
    path: /nic/update
    query: {hostname: "ok.example.com.", myip: 203.0.113.10}
    covers: [update/nohost]
    expect:
      body: "nohost 203.0.113.10"

  - id: update-hostname-lookup-is-case-insensitive
    note: find_hostname lowercases before querying.
    path: /nic/update
    query: {hostname: "OK.EXAMPLE.COM", myip: 203.0.113.10}
    covers: [update/backend-status, update/aggregate-good]
    expect:
      body: "good 203.0.113.10"

  # === GET /nic/update -- backend conditions ================================

  - id: update-911-hostname-with-zero-backends
    path: /nic/update
    query: {hostname: nobackend.example.com, myip: 203.0.113.10}
    covers: [update/no-backends-911]
    expect:
      body: "911 203.0.113.10"

  - id: update-911-hostname-with-zero-backends-ipv6
    note: The `911` half of the five interpolated status tokens.
    path: /nic/update
    query: {hostname: nobackend.example.com, myip: "2001:db8:113::20"}
    covers: [update/no-backends-911]
    expect:
      body: "911 2001:db8:113::20"

  - id: update-911-backend-without-stored-credentials
    path: /nic/update
    query: {hostname: nocreds.example.com, myip: 203.0.113.10}
    covers: [update/backend-no-credentials-911, update/aggregate-other]
    expect:
      body: "911 203.0.113.10"

  - id: update-911-backend-service-unknown-to-factory
    path: /nic/update
    query: {hostname: unknownsvc.example.com, myip: 203.0.113.10}
    covers: [update/backend-unknown-service-911, update/aggregate-other]
    expect:
      body: "911 203.0.113.10"

  - id: update-nohost-hostname-outside-backend-zone
    note: >-
      hostnameperzone returns falsy, contributing `nohost`, which aggregates to
      a nohost line carrying the IP -- indistinguishable on the wire from an
      unregistered hostname.
    path: /nic/update
    query: {hostname: outofzone.example.com, myip: 203.0.113.10}
    covers: [update/backend-out-of-zone-nohost, update/aggregate-other, divergence/1-nohost-ip-suffix]
    expect:
      body: "nohost 203.0.113.10"

  - id: update-good-single-backend
    path: /nic/update
    query: {hostname: ok.example.com, myip: 203.0.113.10}
    covers: [update/backend-status, update/aggregate-good]
    effects:
      dns: [{backend: good, op: create, rtype: A, hostname: ok.example.com, ip: 203.0.113.10}]
      persist: {hostname: ok.example.com, last_ip_v4: 203.0.113.10, last_updated_at: set}
    expect:
      body: "good 203.0.113.10"

  - id: update-nochg-single-backend
    path: /nic/update
    query: {hostname: nochg.example.com, myip: 203.0.113.10}
    covers: [update/backend-status, update/aggregate-nochg]
    effects:
      persist: {hostname: nochg.example.com, last_ip_v4: "203.0.113.10", last_updated_at: unchanged}
    expect:
      body: "nochg 203.0.113.10"

  - id: update-nochg-single-backend-ipv6
    note: >-
      The `nochg` half of the five interpolated status tokens, and the v6 half
      of the "nochg persists nothing" rule -- measured, last_ip_v6 does not move
      on a nochg, exactly as last_ip_v4 does not. The `effects:` block mirrors
      its v4 twin so the pair reads as a pair.
    path: /nic/update
    query: {hostname: nochg.example.com, myip: "2001:db8:113::20"}
    covers: [update/backend-status, update/aggregate-nochg]
    effects:
      persist: {hostname: nochg.example.com, last_ip_v6: "2001:db8:113::20", last_updated_at: unchanged}
    expect:
      body: "nochg 2001:db8:113::20"

  - id: update-dnserr-single-backend
    path: /nic/update
    query: {hostname: dnserr.example.com, myip: 203.0.113.10}
    covers: [update/backend-status, update/aggregate-other]
    expect:
      body: "dnserr 203.0.113.10"

  - id: update-dnserr-single-backend-ipv6
    note: The `dnserr` half of the five interpolated status tokens.
    path: /nic/update
    query: {hostname: dnserr.example.com, myip: "2001:db8:113::20"}
    covers: [update/backend-status, update/aggregate-other]
    expect:
      body: "dnserr 2001:db8:113::20"

  - id: update-aggregate-any-good-wins
    note: results are [dnserr, good]; `'good' in results` short-circuits the error.
    path: /nic/update
    query: {hostname: mixed.example.com, myip: 203.0.113.10}
    covers: [update/aggregate-good]
    effects:
      persist: {hostname: mixed.example.com, last_ip_v4: 203.0.113.10, last_updated_at: set}
    expect:
      body: "good 203.0.113.10"

  - id: update-aggregate-any-good-wins-ipv6
    note: >-
      The aggregation itself is family-blind -- it reads status strings -- but
      the write-back it triggers is not, and this is the case that says a v6
      request over a MIXED backend set still lands in last_ip_v6. Both stub
      calls were measured carrying rtype AAAA, including the one that answers
      dnserr.
    path: /nic/update
    query: {hostname: mixed.example.com, myip: "2001:db8:113::20"}
    covers: [update/aggregate-good]
    effects:
      dns:
        - {backend: dnserr, op: create, rtype: AAAA, hostname: mixed.example.com, ip: "2001:db8:113::20"}
        - {backend: good, op: create, rtype: AAAA, hostname: mixed.example.com, ip: "2001:db8:113::20"}
      persist: {hostname: mixed.example.com, last_ip_v6: "2001:db8:113::20", last_updated_at: set}
    expect:
      body: "good 2001:db8:113::20"

  - id: update-aggregate-all-nochg
    path: /nic/update
    query: {hostname: allnochg.example.com, myip: 203.0.113.10}
    covers: [update/aggregate-nochg]
    expect:
      body: "nochg 203.0.113.10"

  - id: update-aggregate-first-non-good-nochg-status
    note: >-
      results are [nochg, 911, dnserr]. The answer is 911, not dnserr and not
      nochg -- it is the first element that is neither good nor nochg, in
      backend order. Ordering the backends nochg-then-911-then-dnserr makes an
      implementation that returns "the last error" or "the first error overall"
      fail.
    path: /nic/update
    query: {hostname: firsterr.example.com, myip: 203.0.113.10}
    covers: [update/aggregate-other]
    expect:
      body: "911 203.0.113.10"

  # === GET /nic/update -- myip handling =====================================

  - id: update-myip-defaults-to-client-ip
    path: /nic/update
    client_ip: 203.0.113.77
    query: {hostname: ok.example.com}
    covers: [update/myip-defaults-remote-addr, update/aggregate-good]
    expect:
      body: "good 203.0.113.77"

  - id: update-empty-myip-defaults-to-client-ip
    note: myip= is falsy, so it takes the same path as an omitted myip.
    path: /nic/update
    client_ip: 203.0.113.77
    query: {hostname: ok.example.com, myip: ""}
    covers: [update/myip-defaults-remote-addr]
    expect:
      body: "good 203.0.113.77"

  - id: update-myip-defaults-to-a-v6-client-ip
    note: >-
      The v6 half of update-myip-defaults-to-client-ip, and the case closest to
      the shape of real traffic: §3.3.1 measured production at 143 IPv4 / 305
      IPv6 events, and a router behind a v6-only path that omits `myip` is
      exactly how those events are produced. The fallback has to pick AAAA from
      the client address alone -- there is no `myip` to read a family off --
      which is a different decision from the one every other v6 case here makes.
    path: /nic/update
    client_ip: "2001:db8:113::77"
    query: {hostname: ok.example.com}
    covers: [update/myip-defaults-remote-addr, update/aggregate-good]
    effects:
      dns: [{backend: good, op: create, rtype: AAAA, hostname: ok.example.com, ip: "2001:db8:113::77"}]
      persist: {hostname: ok.example.com, last_ip_v6: "2001:db8:113::77", last_ip_v4: unchanged, last_updated_at: set}
    expect:
      body: "good 2001:db8:113::77"

  - id: update-myip-ipv6-is-normalised-in-the-response
    note: >-
      The body echoes str(validated_ip), not the spelling the client sent. A
      case asserting the request spelling would pass against a naive
      implementation and fail against the legacy one.
    path: /nic/update
    query: {hostname: ok.example.com, myip: "2001:0DB8:0000::1"}
    covers: [update/aggregate-good, update/backend-status]
    effects:
      dns: [{backend: good, op: create, rtype: AAAA, hostname: ok.example.com, ip: "2001:db8::1"}]
      persist: {hostname: ok.example.com, last_ip_v6: "2001:db8::1", last_updated_at: set}
    expect:
      body: "good 2001:db8::1"

  - id: update-ipv6-persists-last-ip-v6-not-v4
    note: The A/AAAA choice is invisible on the wire and only observable in the effects.
    path: /nic/update
    query: {hostname: ok.example.com, myip: "2001:db8::2"}
    covers: [update/aggregate-good]
    effects:
      dns: [{backend: good, op: create, rtype: AAAA, hostname: ok.example.com, ip: "2001:db8::2"}]
      persist: {hostname: ok.example.com, last_ip_v6: "2001:db8::2", last_ip_v4: unchanged, last_updated_at: set}
    expect:
      body: "good 2001:db8::2"

  - id: update-ipv4-persists-last-ip-v4-not-v6
    note: >-
      The mirror of update-ipv6-persists-last-ip-v6-not-v4, and the one case
      added by #29 that is deliberately IPv4. The v6 case asserted
      `last_ip_v4: unchanged`; nothing asserted the other direction, so a host
      that wrote BOTH columns on every update passed the frozen table. Measured
      on a hostname carrying a v6 address first: last_ip_v4 moved,
      last_ip_v6 did not. Balancing the families means pairing them, not
      counting them.
    path: /nic/update
    query: {hostname: zz-ok.example.com, myip: 203.0.113.10}
    covers: [update/aggregate-good]
    effects:
      dns: [{backend: good, op: create, rtype: A, hostname: zz-ok.example.com, ip: 203.0.113.10}]
      persist: {hostname: zz-ok.example.com, last_ip_v4: 203.0.113.10, last_ip_v6: unchanged, last_updated_at: set}
    expect:
      body: "good 203.0.113.10"

  - id: update-myip-ipv4-mapped-ipv6-stays-an-aaaa-record
    note: >-
      ::ffff:192.0.2.1 parses as an IPv6Address, so getiptype answers AAAA and
      str() keeps the mapped spelling -- the body is `good ::ffff:192.0.2.1`,
      not `good 192.0.2.1`. Two ways to get this wrong are both plausible and
      both caught here: unwrapping via .ipv4_mapped changes the body, and
      dispatching on "contains a dot" changes the record type. Measured, both
      halves: body and rtype.
    path: /nic/update
    query: {hostname: ok.example.com, myip: "::ffff:192.0.2.1"}
    covers: [update/backend-status, update/aggregate-good]
    effects:
      dns: [{backend: good, op: create, rtype: AAAA, hostname: ok.example.com, ip: "::ffff:192.0.2.1"}]
      persist: {hostname: ok.example.com, last_ip_v6: "::ffff:192.0.2.1", last_updated_at: set}
    expect:
      body: "good ::ffff:192.0.2.1"

  - id: update-myip-ipv6-with-embedded-ipv4-is-renormalised
    note: >-
      A NAT64 literal. 64:ff9b::192.0.2.33 is accepted and comes back as
      64:ff9b::c000:221 -- the dotted tail is re-rendered in hex, because only
      the ::ffff:0:0/96 mapped form keeps it. This is the strongest available
      case for "echo str(validated_ip), never the request spelling": the
      existing normalisation case (2001:0DB8:0000::1) can be passed by a naive
      lowercase-and-compress; this one cannot.
    path: /nic/update
    query: {hostname: ok.example.com, myip: "64:ff9b::192.0.2.33"}
    covers: [update/aggregate-good]
    effects:
      dns: [{backend: good, op: create, rtype: AAAA, hostname: ok.example.com, ip: "64:ff9b::c000:221"}]
      persist: {hostname: ok.example.com, last_ip_v6: "64:ff9b::c000:221", last_updated_at: set}
    expect:
      body: "good 64:ff9b::c000:221"

  - id: update-myip-ipv6-scope-id-round-trips
    note: >-
      A link-local address with a zone index. ipaddress.ip_address has accepted
      scoped v6 since Python 3.9 and str() keeps the zone, so the legacy service
      answers `good fe80::1%eth0` and writes an AAAA. There is no IPv4 analogue
      of this at all -- it is a v6-only parse path that the frozen table left
      entirely unasserted. It is here because the rewrite is the moment it would
      silently change: a stricter validator answers 911 and no other case
      notices. On the wire the runner sends myip=fe80::1%25eth0.
    path: /nic/update
    query: {hostname: ok.example.com, myip: "fe80::1%eth0"}
    covers: [update/backend-status, update/aggregate-good]
    effects:
      dns: [{backend: good, op: create, rtype: AAAA, hostname: ok.example.com, ip: "fe80::1%eth0"}]
      persist: {hostname: ok.example.com, last_ip_v6: "fe80::1%eth0", last_updated_at: set}
    expect:
      body: "good fe80::1%eth0"

  - id: update-updatetype-is-accepted-and-ignored
    path: /nic/update
    query: {hostname: ok.example.com, myip: 203.0.113.10, updatetype: nsupdate}
    covers: [update/updatetype-ignored]
    expect:
      body: "good 203.0.113.10"

  - id: update-unknown-parameters-are-ignored
    note: >-
      The protocol doc says unrecognised parameters may trigger `abuse`. The
      implementation never looks at them.
    path: /nic/update
    query: {hostname: ok.example.com, myip: 203.0.113.10, wildcard: "ON", mx: mail.example.com, offline: "YES", system: dyndns}
    covers: [update/aggregate-good]
    expect:
      body: "good 203.0.113.10"

  # === GET /nic/update -- multi-hostname ordering ===========================

  - id: update-multi-hostname-in-request-order
    note: >-
      Paired with update-multi-hostname-in-reverse-request-order. The two
      requests carry the same hostnames and produce different bodies, which is
      what proves the join is in request order rather than sorted, grouped or
      set-ordered. Either case alone would pass against a sorted implementation.
    path: /nic/update
    query: {hostname: "zz-ok.example.com,never-registered.example.com", myip: 203.0.113.10}
    covers: [update/request-order]
    expect:
      body: |-
        good 203.0.113.10
        nohost 203.0.113.10

  - id: update-multi-hostname-in-reverse-request-order
    path: /nic/update
    query: {hostname: "never-registered.example.com,zz-ok.example.com", myip: 203.0.113.10}
    covers: [update/request-order]
    expect:
      body: |-
        nohost 203.0.113.10
        good 203.0.113.10

  - id: update-multi-hostname-mixed-statuses-in-order
    path: /nic/update
    query: {hostname: "nochg.example.com,nobackend.example.com,ok.example.com,outofzone.example.com", myip: 203.0.113.10}
    covers: [update/request-order, update/aggregate-nochg, update/no-backends-911, update/aggregate-good, update/backend-out-of-zone-nohost]
    expect:
      body: |-
        nochg 203.0.113.10
        911 203.0.113.10
        good 203.0.113.10
        nohost 203.0.113.10

  - id: update-multi-hostname-mixed-statuses-in-order-ipv6
    note: >-
      The same four hostnames in the same order as its v4 twin, so the two
      bodies differ in the address and in nothing else. This is the one case
      that puts all four statuses and a v6 suffix in a single reply: an
      implementation that resolved the family per hostname rather than once per
      request -- from a per-hostname last_ip column, say -- produces a mixed
      body here and passes every single-hostname case.
    path: /nic/update
    query: {hostname: "nochg.example.com,nobackend.example.com,ok.example.com,outofzone.example.com", myip: "2001:db8:113::20"}
    covers: [update/request-order, update/aggregate-nochg, update/no-backends-911, update/aggregate-good, update/backend-out-of-zone-nohost]
    expect:
      body: |-
        nochg 2001:db8:113::20
        911 2001:db8:113::20
        good 2001:db8:113::20
        nohost 2001:db8:113::20

  - id: update-multi-hostname-body-has-no-trailing-newline
    note: >-
      "\n".join produces no trailing newline. Asserted explicitly because a
      framework that appends one is the most likely way this regresses, and a
      comparison that strips whitespace would not see it.
    path: /nic/update
    query: {hostname: "never-registered.example.com,also-never-registered.example.com", myip: 203.0.113.10}
    covers: [update/request-order]
    expect:
      body_ends_with_newline: false
      body: |-
        nohost 203.0.113.10
        nohost 203.0.113.10

  - id: update-duplicate-hostname-produces-two-lines
    note: The list is not deduplicated.
    path: /nic/update
    query: {hostname: "ok.example.com,ok.example.com", myip: 203.0.113.10}
    covers: [update/request-order]
    expect:
      body: |-
        good 203.0.113.10
        good 203.0.113.10

  # === GET /nic/update -- divergences 2, 3 and 4 ============================

  - id: update-no-badagent-for-missing-user-agent
