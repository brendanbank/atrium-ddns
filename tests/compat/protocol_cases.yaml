  - id: delete-nohost-single-label-no-dot
    note: Divergence 5, on the delete path -- and with no IP suffix.
    path: /nic/delete
    query: {hostname: "foo"}
    covers: [delete/hostname-resolution, divergence/5-single-label, divergence/1-nohost-ip-suffix]
