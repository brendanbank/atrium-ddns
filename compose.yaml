# Atrium Ddns — self-contained prod compose.
#
# Pulls atrium from GHCR, builds the host extension on top, brings up
# api + worker + mysql. No proxy, no TLS — atrium speaks plain HTTP on
# :8000 by design. Put your own TLS terminator (Caddy, nginx, the load
# balancer at your edge) in front for production.
#
# Usage (from this directory):
#
#   make env              # .env.example + real secrets. NOT a bare `cp`: the
#                         # example's SECRET_ENCRYPTION_KEY is a placeholder
#                         # atrium refuses, and the api crash-loops behind a
#                         # `up` that exited 0. `make up` guards this.
#   docker compose up -d --build
#   make migrate
#   make seed-admin EMAIL=you@example.com PASSWORD=...
#
# Environment variables come from .env via ${VAR} interpolation.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # `dev` adds pytest + xdist on top of `runtime`; it is a superset, so
      # the stack behaves identically. Build with `--target runtime` (or
      # override ATRIUM_BUILD_TARGET) for a prod image without test tooling.
      target: ${ATRIUM_BUILD_TARGET:-dev}
      args:
        ATRIUM_IMAGE: ${ATRIUM_IMAGE:-ghcr.io/brendanbank/atrium:0.31.0}
        # Build stamp reported by `GET /api/version` and rendered in the
        # user menu. The Makefile exports both from git, so `make up`
        # stamps the worktree's state; a bare `docker compose build`
        # leaves them empty and the menu shows the atrium line only.
        # The atrium half (ATRIUM_VERSION / ATRIUM_COMMIT) comes with the
        # base image as inherited ENV — nothing to pass here.
        ATRIUM_APP_VERSION: ${ATRIUM_APP_VERSION:-}
        ATRIUM_APP_COMMIT: ${ATRIUM_APP_COMMIT:-}
    # Tagged per compose project, not a fixed literal. Pinned to a bare
    # `atrium-ddns:latest` with `pull_policy: never`, two worktrees building
    # concurrently overwrite each other's tag and the loser silently runs the
    # winner's image — no error, no bind mount to correct it, and a green
    # suite testing code the worktree did not write.
    image: ${COMPOSE_PROJECT_NAME:-atrium-ddns}:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      # Passing this is not optional and its absence is silent in dev.
      # `.env` only feeds ${...} interpolation — a variable the container
      # actually needs must be listed here too. Omitted, atrium falls back to
      # its dev-default key: dev boots and encrypts happily against it (so the
      # whole test suite passes), and prod refuses to start with "still the dev
      # default". Caught by a test deploy, not by the gate.
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Atrium Ddns}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:8000}
      MAIL_BACKEND: ${MAIL_BACKEND:-console}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      ATRIUM_HOST_MODULE: atrium_ddns.bootstrap
      # Declarative branding, read by `make seed-brand`
      # (atrium_ddns.scripts.seed_brand). Listed here for the reason the
      # SECRET_ENCRYPTION_KEY comment above gives: `.env` only feeds
      # ${...} interpolation, so a variable the container itself reads has
      # to be named in this block as well. Omitted, the script would fall
      # back to its own default and cheerfully report having written the
      # name the operator did not ask for.
      BRAND_NAME: ${BRAND_NAME:-Atrium Ddns}
      BRAND_PRIMARY_COLOR: ${BRAND_PRIMARY_COLOR:-blue}
      # The frozen compat table's scripted DNS backends. Unset by
      # default and unset in .env.example, so a stack that has not been
      # told to run the table does not resolve them. Passed through
      # rather than hardcoded because the value is the whole control:
      # `atrium_ddns.compat_stub` registers nothing unless this reads
      # exactly "1", and refuses even then when ENVIRONMENT=prod — the
      # stub answers `good` without contacting a nameserver, which on a
      # real tenant is a green update over an unchanged zone.
      ATRIUM_DDNS_COMPAT_STUB: ${ATRIUM_DDNS_COMPAT_STUB:-}
      # Host alembic runs with cwd=/opt/host_app (via -c
      # /opt/host_app/alembic.ini) and its env.py imports from
      # atrium's `app` package. Atrium's source lives at /app — put
      # it on PYTHONPATH so the import resolves no matter where the
      # caller's cwd is.
      PYTHONPATH: /app
    ports:
      # Host port is project-specific so several atrium hosts can run side by
      # side on one dev box. 8053 nods at DNS/53; override with API_HOST_PORT.
      # The container port stays 8000 — atrium's own HEALTHCHECK curls
      # localhost:8000 inside the container.
      #
      # In dev this is the way in. In prod, put TLS in front (the `proxy`
      # profile below) and set API_HOST_PORT to a loopback-only binding, or
      # drop this mapping entirely: atrium speaks plain HTTP, and DynDNS
      # clients authenticate with HTTP Basic, so an exposed plaintext port is
      # every device secret on the wire in base64.
      #
      # The explicit `${API_BIND}:` prefix forces this mapping to ONE family —
      # Docker binds both only when no host address is given. That is correct
      # here (prod pins it to 127.0.0.1) but it is why this port stays IPv4
      # even with `enable_ipv6: true` on the network. The public path is the
      # `proxy` below, whose mapping is deliberately unprefixed so it binds
      # both.
      - "${API_BIND:-0.0.0.0}:${API_HOST_PORT:-8053}:8000"
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    # Tagged per compose project, not a fixed literal. Pinned to a bare
    # `atrium-ddns:latest` with `pull_policy: never`, two worktrees building
    # concurrently overwrite each other's tag and the loser silently runs the
    # winner's image — no error, no bind mount to correct it, and a green
    # suite testing code the worktree did not write.
    image: ${COMPOSE_PROJECT_NAME:-atrium-ddns}:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      # Passing this is not optional and its absence is silent in dev.
      # `.env` only feeds ${...} interpolation — a variable the container
      # actually needs must be listed here too. Omitted, atrium falls back to
      # its dev-default key: dev boots and encrypts happily against it (so the
      # whole test suite passes), and prod refuses to start with "still the dev
      # default". Caught by a test deploy, not by the gate.
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_BACKEND: ${MAIL_BACKEND:-console}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      ATRIUM_HOST_MODULE: atrium_ddns.bootstrap
      PYTHONPATH: /app
    command: ["python", "-m", "app.worker"]
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      disable: true

  # TLS terminator. Enabled with `--profile tls`, so dev is unaffected.
  #
  # Serves a certificate EXTRACTED from the old service's ACME store rather
  # than running ACME itself — that store has one writer already and a second
  # would corrupt it. The copy goes stale when the writer renews; see
  # scripts/extract-acme-cert.sh and `make tls-refresh`.
  proxy:
    image: traefik:3.7
    profiles: [tls]
    restart: unless-stopped
    command:
      - --entrypoints.websecure.address=:8443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --log.level=INFO
      - --accesslog=true
      # JSON rather than the default CLF, because a log line is only as useful
      # as the thing that can query it: compose.loki.yaml promotes
      # DownstreamStatus and RouterName to Loki labels, and a CLF line gives
      # that pipeline stage nothing to parse. Costs a dev stack nothing —
      # `docker compose logs proxy` is one field per line either way.
      #
      # Traefik's own application log (--log.level above) stays plain text, so
      # this container's stdout is mixed. That is fine downstream, and measured
      # rather than assumed: a json stage that cannot parse a line extracts
      # nothing from it rather than dropping it, so the startup lines arrive
      # with no `status` label beside the access log that has one.
      #
      # --log.format=json is deliberately NOT set. It would buy nothing here:
      # the access log already carries a `level` of its own ("info" on every
      # line — read off the deployed container, so the `level` label lands
      # either way), and the two streams would still share a shape without
      # sharing a field set — no DownstreamStatus on an application line, no
      # request on an access one.
      - --accesslog.format=json
      # Query strings are dropped at the producer. /nic/* accepts only HTTP
      # Basic (query-parameter auth was removed), but a client that appends
      # credentials anyway must not have them land in a log. `redact` is NOT
      # a real mode — it parses, starts cleanly, and behaves as `keep`.
      #
      # This is also why nothing downstream redacts: dyndns-route53 ran a Loki
      # `replace` stage that was correct in every isolated test and still
      # leaked a canary password on the live container. Stripping here has no
      # such failure mode.
      - --accesslog.fields.queryparameters.defaultmode=drop
    ports:
      - "${TLS_HOST_PORT:-8443}:8443"
    volumes:
      - ./infra/traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - ${TLS_CERT_DIR:-./certs}:/certs:ro
    depends_on:
      api:
        condition: service_started

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # Published so a local client (mysql CLI, TablePlus) can reach it
      # without `docker compose exec`. Deliberately NOT 3306: every
      # other project on this box would collide with it. Override with
      # MYSQL_HOST_PORT; set it empty and delete this mapping if you
      # don't want the port exposed at all.
      - "${MYSQL_HOST_PORT:-13353}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  # No `name:` override on purpose. Compose already namespaces volumes by
  # project (`<project>_mysql_data`), which is exactly the isolation wanted;
  # pinning a literal defeated it, so a second worktree's MySQL attached the
  # first's data directory and died on `InnoDB: Unable to lock ./ibdata1`.
  #
  # UPGRADING an existing deployment: the volume name changes from
  # `atrium_ddns_mysql_data` to `<project>_mysql_data`. The old volume is
  # orphaned, not deleted — a fresh empty database comes up beside it. Either
  # re-run migrations and re-seed, or copy the data across first. Do not
  # discover this on a stack that matters.
  mysql_data:

networks:
  # IPv6 on purpose, and it is not cosmetic.
  #
  # Docker publishes a port on `[::]` only when the container's network has
  # IPv6. Without this the stack listens on 0.0.0.0 alone and **refuses**
  # IPv6 connections outright — measured on the deploy host: `:443` on the
  # old service answered over IPv6, `:8443` here did not connect, and
  # `ss -ltnp` showed `[::]:443` present while 8443 was bound to 0.0.0.0
  # only.
  #
  # That matters more here than for a typical app: about 68% of this
  # service's real update traffic arrives over IPv6 (305 of 448 events in a
  # 24h window). Cutting over without this refuses roughly two thirds of the
  # fleet — not degraded, refused — and a DynDNS client that cannot connect
  # is silent, so the symptom appears hours later as hostnames going stale.
  #
  # The legacy stack already sets `enable_ipv6: true` on its own network.
  # This is that fence, copied deliberately rather than rediscovered.
  default:
    enable_ipv6: true
